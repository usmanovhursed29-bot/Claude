<title>Kwantoww</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell, quiet sidebar 248px + fluid content capped at 1480; on phones a top bar and a bottom tab bar.
   Direction: a personal day console. Calm, exact, a little warm. World: a desk and a paper planner in morning light.
   Moments: the day score card and the bank card. Signature: the year ruler, 53 week ticks, "день N из 365". */
:root{
  --bg:#f6f5f2; --side:#efede8; --card:#ffffff; --raised:#f1efea; --hover:#ebe8e2;
  --line:rgba(30,27,22,.08); --line2:rgba(30,27,22,.14);
  --fg:#1d1b17; --fg2:#57524a; --fg3:#78726a;
  --accent:#2c52c4; --accent-ink:#2346ab; --on-accent:#ffffff; --accent-soft:rgba(44,82,196,.10);
  --card-a:#2b50bd; --card-a2:#2446a8; --on-card:#f3f5fb; --on-card2:rgba(243,245,251,.72);
  --ember:#c4562c; --ember2:#b54c24;
  --good:#1d7f47; --bad:#c43a30; --warn:#9a6a12;
  --c1:#3f7a54; --c2:#c26a2e; --c3:#3a5cb8; --c4:#7a4fa3; --c5:#a8792a; --c6:#2f7f86;
  --shadow:0 1px 2px rgba(0,0,0,.04); --float:0 8px 24px rgba(0,0,0,.08);
  --font:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413; --side:#0f0f0e; --card:#1b1b1a; --raised:#242422; --hover:#2a2a28;
  --line:rgba(237,235,230,.08); --line2:rgba(237,235,230,.14);
  --fg:#ecebe7; --fg2:#a7a39b; --fg3:#8b877f;
  --accent:#7d9cf2; --accent-ink:#93adf5; --on-accent:#0c1226; --accent-soft:rgba(125,156,242,.14);
  --card-a:#2a4596; --card-a2:#243c84; --on-card:#eef1fa; --on-card2:rgba(238,241,250,.7);
  --ember:#d9744a; --ember2:#c9663d;
  --good:#4cc38a; --bad:#e5484d; --warn:#d6a243;
  --c1:#62a87a; --c2:#dc8a52; --c3:#7d9cf2; --c4:#a888d0; --c5:#cfa250; --c6:#5fb0b6;
  --shadow:none; --float:0 8px 24px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141413; --side:#0f0f0e; --card:#1b1b1a; --raised:#242422; --hover:#2a2a28;
  --line:rgba(237,235,230,.08); --line2:rgba(237,235,230,.14);
  --fg:#ecebe7; --fg2:#a7a39b; --fg3:#8b877f;
  --accent:#7d9cf2; --accent-ink:#93adf5; --on-accent:#0c1226; --accent-soft:rgba(125,156,242,.14);
  --card-a:#2a4596; --card-a2:#243c84; --on-card:#eef1fa; --on-card2:rgba(238,241,250,.7);
  --ember:#d9744a; --ember2:#c9663d;
  --good:#4cc38a; --bad:#e5484d; --warn:#d6a243;
  --c1:#62a87a; --c2:#dc8a52; --c3:#7d9cf2; --c4:#a888d0; --c5:#cfa250; --c6:#5fb0b6;
  --shadow:none; --float:0 8px 24px rgba(0,0,0,.4); color-scheme:dark;
}
/* accent choices */
:root[data-accent="moss"]{--accent:#2f7048;--accent-ink:#285f3d;--accent-soft:rgba(47,112,72,.10);--card-a:#2f6a46;--card-a2:#285d3d}
:root[data-accent="ember"]{--accent:#b04a22;--accent-ink:#9a3f1c;--accent-soft:rgba(176,74,34,.10);--card-a:#b3522b;--card-a2:#a14824}
:root[data-accent="graphite"]{--accent:#2b2a27;--accent-ink:#2b2a27;--accent-soft:rgba(43,42,39,.08);--card-a:#2d2c29;--card-a2:#262522}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-accent="moss"]{--accent:#6cbf8a;--accent-ink:#7fcb9a;--on-accent:#0b1a10;--accent-soft:rgba(108,191,138,.14);--card-a:#2c5a3d;--card-a2:#264f35}
  :root:not([data-theme="light"])[data-accent="ember"]{--accent:#e48a62;--accent-ink:#eb9a76;--on-accent:#1f0c04;--accent-soft:rgba(228,138,98,.14);--card-a:#8f4122;--card-a2:#7f391d}
  :root:not([data-theme="light"])[data-accent="graphite"]{--accent:#e6e4df;--accent-ink:#e6e4df;--on-accent:#141413;--accent-soft:rgba(230,228,223,.10);--card-a:#2c2c2a;--card-a2:#262624}
}
:root[data-theme="dark"][data-accent="moss"]{--accent:#6cbf8a;--accent-ink:#7fcb9a;--on-accent:#0b1a10;--accent-soft:rgba(108,191,138,.14);--card-a:#2c5a3d;--card-a2:#264f35}
:root[data-theme="dark"][data-accent="ember"]{--accent:#e48a62;--accent-ink:#eb9a76;--on-accent:#1f0c04;--accent-soft:rgba(228,138,98,.14);--card-a:#8f4122;--card-a2:#7f391d}
:root[data-theme="dark"][data-accent="graphite"]{--accent:#e6e4df;--accent-ink:#e6e4df;--on-accent:#141413;--accent-soft:rgba(230,228,223,.10);--card-a:#2c2c2a;--card-a2:#262624}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tab{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand .mark{width:24px;height:24px;border-radius:6px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:12px;font-family:var(--mono);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:var(--fg2);text-decoration:none;transition:background-color .15s var(--ease),color .15s var(--ease)}
.nav a:hover{background:var(--hover);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.nav a .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--fg3)}
.nav-label{font-size:12px;color:var(--fg3);padding:20px 10px 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:16px}
.seg{display:flex;background:var(--raised);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--fg3);transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.sync{font-size:12px;color:var(--fg3);padding:0 8px;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--fg3);flex:none}
.dot.ok{background:var(--good)}

.main{min-width:0;padding-block:24px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:30px;line-height:36px;font-weight:500;letter-spacing:-.02em;margin:0;text-wrap:balance}
.head .sub{color:var(--fg2);font-size:15px;margin-top:4px}
.head-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* top bar + focus pill */
.focus-pill{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 8px;border-radius:18px;background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.focus-pill .t{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.focus-pill .lbl{font-size:12px;color:var(--fg3)}
.focus-pill .play{width:26px;height:26px;border-radius:13px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.focus-pill .play svg{width:14px;height:14px}

/* year ruler (signature) */
.ruler{display:flex;gap:3px;align-items:flex-end;height:16px;margin-top:12px;max-width:520px}
.ruler i{flex:1;height:8px;border-radius:1px;background:var(--line2)}
.ruler i.on{background:var(--fg3)}
.ruler i.now{background:var(--accent);height:16px}
.ruler i.m{height:12px}

/* cards & grid */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-main-r{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);padding:20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card.tight{padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-h h2{font-size:15px;font-weight:500;margin:0;display:flex;align-items:center;gap:8px}
.card-h h2 svg{color:var(--fg3)}
.meta{font-size:12px;color:var(--fg3)}
.muted{color:var(--fg3)} .sec{color:var(--fg2)}
.stat{display:flex;flex-direction:column;gap:4px}
.score{justify-content:space-between}
.stat .lbl{font-size:13px;color:var(--fg2)}
.stat .val{font-size:30px;line-height:34px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .val small{font-size:16px;color:var(--fg3);font-weight:400}
.chg{font-size:12px;color:var(--fg3)} .chg.up{color:var(--good)} .chg.down{color:var(--bad)}
.solid{background:linear-gradient(180deg,var(--card-a),var(--card-a2));color:var(--on-card);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.solid .lbl,.solid .meta,.solid .muted{color:var(--on-card2)}
.solid.ember{background:linear-gradient(180deg,var(--ember),var(--ember2))}
.empty{color:var(--fg3);font-size:13px;padding:8px 0}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg);font-weight:500;font-size:13px;white-space:nowrap;transition:background-color .15s var(--ease),transform .12s var(--ease)}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--fg);color:var(--bg);box-shadow:none}
.btn.acc{background:var(--accent);color:var(--on-accent);box-shadow:none}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.ghost{background:none;box-shadow:none;color:var(--fg2)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.icon{width:36px;padding:0}
.btn.danger{color:var(--bad)}
.in,select.in,textarea.in{height:36px;border-radius:9px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);padding:0 12px;min-width:0;width:100%;transition:box-shadow .15s var(--ease)}
textarea.in{height:auto;padding:10px 12px;resize:vertical;line-height:22px}
.in:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--fg2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1 1 160px}
.task-form{grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr))!important}
@media(max-width:700px){.task-form{grid-template-columns:repeat(2,minmax(0,1fr))!important}.task-form input[name=title]{grid-column:1/-1}}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);height:22px}
.tag-dot{width:7px;height:7px;border-radius:50%;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{height:36px;padding:0 12px;color:var(--fg2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s var(--ease)}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--fg)}
.toggle{width:36px;height:22px;border-radius:11px;background:var(--line2);position:relative;flex:none;transition:background-color .15s var(--ease)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:8px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .18s var(--ease)}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{transform:translateX(14px)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.li .r{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--fg2);white-space:nowrap}
.check{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--line2);display:grid;place-items:center;flex:none;color:transparent;transition:background-color .15s var(--ease)}
.check svg{width:14px;height:14px;stroke-width:2}
.check[aria-checked="true"]{background:var(--fg);box-shadow:none;color:var(--bg)}
.done .t{color:var(--fg3);text-decoration:line-through}
.x{opacity:.0;transition:opacity .15s var(--ease);color:var(--fg3)}
.li:hover .x,.x:focus-visible,.x.armed{opacity:1}
.x.armed{color:var(--bad);font-size:12px}
@media (hover:none){.x{opacity:.7}}

/* bars & meters */
.meter{height:6px;border-radius:3px;background:var(--raised);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.meter>i{display:block;height:100%;background:var(--fg);border-radius:3px}
.meter.acc>i{background:var(--accent)}
.meter.over>i{background:var(--bad)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--fg3)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:var(--fg3);stroke-width:1.5;stroke-dasharray:4 4}
.chart .ar{fill:var(--accent-soft);stroke:none}
.chart .pt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.chart .bar{fill:var(--line2)}
.chart .bar.hl{fill:var(--accent)}
.chart .vl{fill:var(--fg);font-size:12px}

/* overview */
.score{display:flex;flex-direction:column;gap:16px}
.score .big{font-size:64px;line-height:64px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score .parts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.score .parts div{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--on-card2)}
.score .parts i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.score .parts i b{display:block;height:100%;background:var(--on-card)}
.demo-note{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--fg2)}
.demo-note .grow{flex:1 1 240px}

/* tasks */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg2);padding:0 4px 4px}
.col-h .num{margin-left:auto;font-size:12px;color:var(--fg3)}
.task{background:var(--card);border-radius:12px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);padding:12px;display:flex;gap:10px;align-items:flex-start}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.task .t{overflow-wrap:anywhere}
.task.done .t{color:var(--fg3);text-decoration:line-through}
.task .acts{display:flex;gap:2px;opacity:0;transition:opacity .15s var(--ease)}
.task:hover .acts,.task:focus-within .acts{opacity:1}
@media (hover:none){.task .acts{opacity:1}}
.late{color:var(--bad)}

/* calendar week */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.week{background:var(--card);border-radius:14px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);overflow:hidden}
.week-h{display:grid;grid-template-columns:48px repeat(var(--days),minmax(0,1fr));border-bottom:1px solid var(--line)}
.week-h div{padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.week-h .wd{font-size:11px;color:var(--fg3)}
.week-h .d{font-family:var(--mono);font-size:15px;width:28px;height:28px;display:grid;place-items:center;border-radius:14px}
.week-h .today .d{background:var(--fg);color:var(--bg)}
.week-b{display:grid;grid-template-columns:48px repeat(var(--days),minmax(0,1fr));position:relative;max-height:620px;overflow-y:auto}
.hours div{height:48px;font-family:var(--mono);font-size:11px;color:var(--fg3);text-align:right;padding-right:8px;transform:translateY(-7px)}
.daycol{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 48px;cursor:copy}
.daycol.today{background-color:var(--accent-soft)}
.ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 8px;font-size:12px;line-height:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);transition:background-color .15s var(--ease)}
.ev:hover{background:var(--hover)}
.ev .et{font-weight:500;overflow-wrap:anywhere}
.ev .em{font-family:var(--mono);font-size:11px;color:var(--fg3)}
.ev .tag-dot{position:absolute;top:8px;right:8px}
.nowline{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--bad);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-4.5px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.mini .wd{font-size:11px;color:var(--fg3);padding:4px 0}
.mini button{height:30px;border-radius:8px;font-family:var(--mono);font-size:12px;position:relative;color:var(--fg2)}
.mini button:hover{background:var(--hover)}
.mini button.out{color:var(--fg3);opacity:.5}
.mini button.today{color:var(--fg);font-weight:500;box-shadow:inset 0 0 0 1px var(--line2)}
.mini button.sel{background:var(--fg);color:var(--bg)}
.mini button.has::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--accent)}
.mini button.sel.has::after{background:var(--bg)}

/* habits */
.hab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days7 button{height:24px;border-radius:6px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);transition:background-color .15s var(--ease)}
.days7 button.on{box-shadow:none}
.days7 .wd{font-size:10px;color:var(--fg3);text-align:center;font-family:var(--mono)}
.heat{display:grid;gap:3px;overflow-x:auto}
.heat-row{display:grid;grid-template-columns:120px repeat(30,minmax(10px,1fr));gap:3px;align-items:center}
.heat-row span{font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat-row i{height:14px;border-radius:3px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.heat-row i.on{box-shadow:none}
.bigcheck{width:32px;height:32px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line2);display:grid;place-items:center;color:transparent;flex:none;transition:background-color .15s var(--ease)}
.bigcheck.on{color:#fff;box-shadow:none}

/* health */
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ring svg{width:112px;height:112px}
.ring .rv{font-family:var(--mono);font-size:20px;fill:var(--fg)}
.ring .rs{font-size:10px;fill:var(--fg3);font-family:var(--font)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.quick form,.quick>button{background:var(--raised);border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.quick>button:hover{background:var(--hover)}
.quick .ql{font-size:12px;color:var(--fg2);display:flex;align-items:center;gap:6px}
.quick .in{height:30px;background:var(--card)}

/* nutrition */
.kbju{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kbju div{display:flex;flex-direction:column;gap:2px}
.kbju .v{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.warnbox{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg2);display:flex;gap:8px}
.warnbox svg{color:var(--warn);margin-top:1px}

/* finance */
.bank{aspect-ratio:1.586;max-width:100%;border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,var(--card-a),var(--card-a2));color:var(--on-card);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),var(--float);position:relative;overflow:hidden}
.bank .chip-ic{width:36px;height:28px;border-radius:6px;background:linear-gradient(180deg,#d8c58e,#b9a46a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.bank .chip-ic::after{content:"";display:block;margin:6px 8px;height:14px;border-top:1px solid rgba(0,0,0,.25);border-bottom:1px solid rgba(0,0,0,.25)}
.bank .sum{font-size:32px;line-height:36px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bank .lbl{font-size:12px;color:var(--on-card2)}
.bank .pan{font-family:var(--mono);font-size:13px;color:var(--on-card2);letter-spacing:.08em}
.acc-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}

/* notes */
.notes{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.note-item{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;text-align:left;width:100%;transition:background-color .15s var(--ease)}
.note-item:hover{background:var(--hover)}
.note-item[aria-current="true"]{background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.note-item .nt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item .np{font-size:12px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-title{font-size:22px;font-weight:500;border:0;background:none;padding:0;width:100%}
.note-title:focus{outline:none}
.note-body{border:0;background:none;width:100%;min-height:420px;resize:vertical;line-height:24px;font-size:15px;padding:0}
.note-body:focus{outline:none}

/* assistant */
.ai{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.chat{background:var(--card);border-radius:14px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);display:flex;flex-direction:column;min-height:560px}
.msgs{flex:1;padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;max-height:62vh}
.msg{max-width:78%;display:flex;flex-direction:column;gap:4px}
.msg .b{padding:10px 14px;border-radius:12px;line-height:22px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;align-items:flex-end}
.msg.u .b{background:var(--fg);color:var(--bg)}
.msg.a .b{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.msg .meta{padding:0 4px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px}
.sugg button{height:30px;padding:0 12px;border-radius:15px;font-size:12px;color:var(--fg2);box-shadow:inset 0 0 0 1px var(--line2);transition:background-color .15s var(--ease)}
.sugg button:hover{background:var(--hover);color:var(--fg)}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;height:40px;max-height:140px;padding:10px 12px;border-radius:10px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);line-height:20px}
.composer textarea:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
.see{display:flex;align-items:center;gap:10px;height:40px;border-top:1px solid var(--line)}
.see:first-of-type{border-top:0}
.see span{flex:1}
.thread{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;text-align:left;width:100%}
.thread:hover{background:var(--hover)}
.thread[aria-current="true"] .tt{color:var(--accent-ink)}
.thread .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;align-items:start}
.set-row{display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row>span{flex:1;display:flex;align-items:center;gap:8px}
.set-row>span svg{color:var(--fg3)}
.set-row select.in,.set-row input.in{width:120px;height:32px}

/* mobile chrome */
.topbar,.tabbar,.sheet{display:none}
@media (max-width:1100px){

}
@media (max-width:900px){

  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);height:56px;align-items:center;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;font-size:11px;color:var(--fg3);text-decoration:none}
  .tabbar [aria-current="page"]{color:var(--fg)}
  .main{padding-block:20px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .head h1{font-size:26px;line-height:32px}

  .score .big{font-size:52px;line-height:52px}
  .msgs{max-height:none}
  .msg{max-width:92%}
  .head-tools .focus-pill{display:none}
  .sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.32)}
  .sheet.open{display:block}
  .sheet .panel{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
  .sheet .nav a{height:44px}
  .notes.editing .note-list{display:none}
  .notes:not(.editing) .note-ed{display:none}
}
@media (max-width:520px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat .val{font-size:24px;line-height:28px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .rings{gap:4px}.ring svg{width:92px;height:92px}
  .heat-row{grid-template-columns:84px repeat(30,minmax(6px,1fr));gap:2px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.enter{animation:enter .36s var(--ease) both}
/* motion that explains: charts draw in on arrival, numbers count, toggles confirm */
.anim .chart .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s var(--ease) .1s forwards}

.typing{display:inline-flex;gap:4px;padding:4px 0}

.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.fring{position:absolute;inset:-3px;width:32px;height:32px;transform:rotate(-90deg);pointer-events:none}
.fring circle{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;transition:stroke-dasharray 1s linear}
.play-w{position:relative;width:26px;height:26px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes ring{from{stroke-dasharray:0 300}}
@keyframes pop{40%{transform:scale(.86)}}
@keyframes card{from{opacity:.001;transform:translateY(10px) rotate(-1.5deg)}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes enter{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}

<script>
"use strict";
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>iso(new Date());
const rid=()=>Math.random().toString(36).slice(2,10);
const nf=new Intl.NumberFormat("ru-RU");
const fmt=n=>nf.format(Math.round(n||0));
const fmt1=n=>new Intl.NumberFormat("ru-RU",{maximumFractionDigits:1}).format(n||0);
const rub=n=>fmt(n)+" ₽";
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const MG=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MP=["январе","феврале","марте","апреле","мае","июне","июле","августе","сентябре","октябре","ноябре","декабре"];
const WD=["вс","пн","вт","ср","чт","пт","сб"];
const WDL=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const dLabel=s=>{const d=parse(s);return `${d.getDate()} ${MG[d.getMonth()]}`};
const weekStart=d=>{const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(0,0,0,0);return x};
const dayOfYear=d=>Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(d.getFullYear(),0,1))/864e5)+1;
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const hm=min=>{min=Math.round(min||0);const h=Math.floor(min/60),m=min%60;return h?`${h} ч ${pad(m)}`:`${m} мин`};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;if(n>10&&n<20)return c;if(k>1&&k<5)return b;if(k===1)return a;return c};
const ic=(id,cls="")=>`<svg class="i ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

/* ---------- state ---------- */
const KEYS=["settings","tasks","events","habits","health","food","workouts","money","notes","chats","focus","meta"];

/* ---------- storage: claude db (synced between devices) with local fallback ---------- */
const store={mode:"local",db:null,uid:null,timers:{},busy:{},again:{}};
const LS="kwantoww:v1";
function lsRead(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch{return null}}
function lsWrite(){try{const o={};KEYS.forEach(k=>o[k]=S[k]);localStorage.setItem(LS,JSON.stringify(o))}catch{}}
function persist(key){
  lsWrite();
  if(store.mode!=="db")return;
  clearTimeout(store.timers[key]);
  store.timers[key]=setTimeout(()=>flush(key),500);
}
async function flush(key){
  if(store.busy[key]){store.again[key]=true;return}
  store.busy[key]=true;setSync("saving");
  try{await store.db.doc(`data/users/${store.uid}/kw1/${key}`).set({v:S[key],at:Date.now()});setSync("ok")}
  catch(e){setSync("err")}
  store.busy[key]=false;
  if(store.again[key]){store.again[key]=false;flush(key)}
}
function setSync(st){
  const el=$("#sync");if(!el)return;
  const txt={ok:"Синхронизировано",saving:"Сохраняю",err:"Не удалось сохранить, повторю при следующем изменении",local:"Только на этом устройстве",load:"Загружаю данные"}[st];
  el.innerHTML=`<span class="dot ${st==="ok"||st==="saving"?"ok":""}"></span><span>${txt}</span>`;
}
function applyLoaded(obj){
  const D=defaults();
  KEYS.forEach(k=>{S[k]=obj&&obj[k]!=null?obj[k]:D[k]});
  S.settings={...D.settings,...S.settings,goals:{...D.settings.goals,...(S.settings.goals||{})},focus:{...D.settings.focus,...(S.settings.focus||{})},aiSee:{...D.settings.aiSee,...(S.settings.aiSee||{})}};
  S.food={...D.food,...S.food,profile:{...D.food.profile,...(S.food.profile||{})}};
  S.money={...D.money,...S.money};
  S.health={...D.health,...S.health};S.focus={...D.focus,...S.focus};
}
async function boot(){
  const local=lsRead();
  applyLoaded(local);
  applyTheme();route();
  setSync("load");
  let db=null,uid=null;
  try{
    const c=window.claude;
    if(c&&c.use){
      const to=new Promise(r=>setTimeout(()=>r(null),10000));
      db=await Promise.race([c.use("db"),to]);
      if(db){const user=await Promise.race([c.use("user"),to]);uid=user?await user.id():null}
    }
  }catch(e){db=null}
  if(!db||!uid){setSync("local");if(!local)lsWrite();return}
  store.db=db;store.uid=uid;
  try{
    const snaps=await Promise.race([Promise.all(KEYS.map(k=>db.doc(`data/users/${uid}/kw1/${k}`).get())),new Promise((_,j)=>setTimeout(()=>j(new Error("timeout")),10000))]);
    const any=snaps.some(s=>s.exists);
    store.mode="db";
    if(any){const o={};snaps.forEach((s,i)=>{if(s.exists)o[KEYS[i]]=s.data().v});applyLoaded(o);lsWrite();applyTheme();route()}
    else{for(const k of KEYS){await flush(k)}}
    setSync("ok");
  }catch(e){setSync("local")}
}
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible"||store.mode!=="db")return;
  if(Object.values(store.busy).some(Boolean))return;
  try{const snaps=await Promise.all(KEYS.map(k=>store.db.doc(`data/users/${store.uid}/kw1/${k}`).get()));
    const o={};snaps.forEach((s,i)=>{if(s.exists)o[KEYS[i]]=s.data().v});
    if(Object.keys(o).length&&!document.activeElement?.matches("input,textarea")){applyLoaded({...Object.fromEntries(KEYS.map(k=>[k,S[k]])),...o});applyTheme();render()}
  }catch{}
});
function commit(...keys){keys.forEach(persist);render()}

/* ---------- derived data ---------- */
const hlog=d=>S.health.log[d]||{};
const meals=d=>S.food.meals[d]||[];
const eaten=d=>meals(d).reduce((a,m)=>({kcal:a.kcal+(+m.kcal||0),p:a.p+(+m.p||0),f:a.f+(+m.f||0),c:a.c+(+m.c||0)}),{kcal:0,p:0,f:0,c:0});
function lastWeight(){const ks=Object.keys(S.health.log).sort();for(let i=ks.length-1;i>=0;i--){const w=S.health.log[ks[i]].weight;if(w)return w}return S.food.profile.weight}

function plan(){
  const p=S.food.profile,w=+p.weight||0,h=+p.height||0,a=+p.age||0,tg=+p.target||0;
  if(!w||!h||!a)return null;
  const bmr=10*w+6.25*h-5*a+(p.sex==="f"?-161:5);
  const tdee=bmr*(+p.activity||1.2);
  const hasGoal=tg>0&&!!p.deadline&&p.deadline>today();
  const days=hasGoal?Math.max(1,daysBetween(today(),p.deadline)):0;
  const delta=hasGoal?tg-w:0; // negative = lose
  const want=hasGoal?delta*7700/days:0; // kcal/day change
  const floor=p.sex==="f"?1200:1500;
  const maxDef=Math.min(1000,w*0.01*7700/7,Math.max(0,tdee-floor));
  const maxSur=Math.min(500,w*0.005*7700/7);
  let adj=want,capped=false;
  if(adj<-maxDef){adj=-maxDef;capped=true}
  if(adj>maxSur){adj=maxSur;capped=true}
  let kcal=Math.round((tdee+adj)/10)*10;
  if(S.settings.goals.kcal>0)kcal=+S.settings.goals.kcal;
  const lose=delta<0;
  const prot=Math.round((lose?2.0:1.8)*(lose?Math.max(tg,w*0.9):w));
  const fat=Math.max(Math.round(0.9*w),Math.round(kcal*0.25/9));
  const carb=Math.max(50,Math.round((kcal-prot*4-fat*9)/4));
  const realDays=adj!==0?Math.ceil(Math.abs(delta*7700/adj)):0;
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),days,delta,adj:Math.round(adj),capped,kcal,prot,fat,carb,pace:adj*7/7700,realDate:iso(addDays(new Date(),realDays)),manual:S.settings.goals.kcal>0,hasGoal};
}

function dayScore(d){
  const parts=[];const l=hlog(d),g=S.settings.goals;
  if(S.habits.length)parts.push(["Привычки",30,S.habits.filter(h=>h.log[d]).length/S.habits.length]);
  if(l.sleep)parts.push(["Сон",25,clamp(l.sleep/g.sleep,0,1)]);
  if(l.water!=null)parts.push(["Вода",15,clamp(l.water/g.water,0,1)]);
  const P=plan(),e=eaten(d);
  if(P&&e.kcal)parts.push(["Питание",15,1-clamp(Math.abs(e.kcal-P.kcal)/P.kcal/0.35,0,1)]);
  const moved=S.workouts.some(w=>w.date===d)?1:clamp((l.steps||0)/g.steps,0,1);
  parts.push(["Движение",15,moved]);
  const W=parts.reduce((a,p)=>a+p[1],0);
  return{score:W?Math.round(parts.reduce((a,p)=>a+p[1]*p[2],0)/W*100):0,parts};
}
function streak(h){let n=0;let d=new Date();if(!h.log[iso(d)])d=addDays(d,-1);while(h.log[iso(d)]){n++;d=addDays(d,-1)}return n}
function bestStreak(h){const ks=Object.keys(h.log).filter(k=>h.log[k]).sort();let best=0,cur=0,prev=null;ks.forEach(k=>{cur=prev&&daysBetween(prev,k)===1?cur+1:1;best=Math.max(best,cur);prev=k});return best}
function monthTx(off=0){const t=new Date();const m=new Date(t.getFullYear(),t.getMonth()+off,1);const key=`${m.getFullYear()}-${pad(m.getMonth()+1)}`;return S.money.tx.filter(x=>x.date.startsWith(key))}
const spent=list=>list.filter(x=>x.type==="exp").reduce((a,x)=>a+(+x.amount||0),0);
const income=list=>list.filter(x=>x.type==="inc").reduce((a,x)=>a+(+x.amount||0),0);

/* ---------- charts ---------- */
function lineChart(vals,labels,o={}){
  const W=o.w||640,H=o.h||220,pl=o.pl??40,pr=16,pt=16,pb=28;
  const nums=vals.filter(v=>v!=null);if(!nums.length)return`<div class="empty">Пока нет данных</div>`;
  let lo=o.min??Math.min(...nums,...(o.extra||[])),hi=o.max??Math.max(...nums,...(o.extra||[]));
  if(hi===lo){hi+=1;lo-=1}
  const padv=(hi-lo)*.12;if(o.min==null)lo-=padv;if(o.max==null)hi+=padv;
  const X=i=>pl+(W-pl-pr)*(vals.length<2?.5:i/(vals.length-1));
  const Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g="";for(let k=0;k<4;k++){const v=lo+(hi-lo)*k/3;g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end">${o.fy?o.fy(v):Math.round(v)}</text>`}
  const step=Math.max(1,Math.ceil(labels.length/8));
  let xl="";labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)xl+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`});
  let d="",area="",first=null,last=null;
  vals.forEach((v,i)=>{if(v==null)return;const c=`${X(i).toFixed(1)},${Y(v).toFixed(1)}`;d+=(d?"L":"M")+c;if(first==null)first=i;last=i});
  if(first!=null)area=`M${X(first)},${H-pb}L`+d.slice(1)+`L${X(last)},${H-pb}Z`;
  let extra="";if(o.target!=null){extra=`<line class="ln2" x1="${pl}" x2="${W-pr}" y1="${Y(o.target)}" y2="${Y(o.target)}"/><text x="${W-pr}" y="${Y(o.target)-6}" text-anchor="end">${esc(o.targetLabel||"")}</text>`}
  if(o.proj){const[i0,v0,i1,v1]=o.proj;extra+=`<path class="ln2" d="M${X(i0)},${Y(v0)}L${X(i1)},${Y(v1)}"/>`}
  const lv=vals[last];
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"График")}">${g}${xl}${extra}<path class="ar" d="${area}"/><path class="ln" pathLength="1" d="${d}"/><circle class="pt" cx="${X(last)}" cy="${Y(lv)}" r="4"/><text class="vl" x="${Math.min(X(last),W-pr-4)}" y="${Y(lv)-12}" text-anchor="end">${o.fy?o.fy(lv):Math.round(lv)}</text></svg>`;
}
function barChart(vals,labels,o={}){
  const W=o.w||640,H=o.h||180,pl=o.pl??8,pr=8,pt=20,pb=24,n=vals.length;
  const hi=Math.max(1,...vals);const bw=(W-pl-pr)/n;
  let s="";vals.forEach((v,i)=>{const h=(H-pt-pb)*(v/hi);const x=pl+i*bw+bw*.18;const w=bw*.64;
    s+=`<rect class="bar ${i===o.hl?"hl":""}" style="--i:${i}" x="${x}" y="${H-pb-h}" width="${w}" height="${Math.max(h,v?2:0)}" rx="4"/>`;
    if(v||i===o.hl)s+=`<text x="${x+w/2}" y="${H-pb-h-6}" text-anchor="middle" ${i===o.hl?'class="vl"':""}>${o.fv?o.fv(v):v}</text>`;
    s+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`});
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"Диаграмма")}"><line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/>${s}</svg>`;
}
function ring(frac,val,sub,color="var(--accent)"){
  const r=44,c=2*Math.PI*r,f=clamp(frac||0,0,1)||0.0001;
  return`<svg viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--raised)" stroke-width="8"/><circle cx="56" cy="56" r="${r}" fill="none" class="arc" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 56 56)"/><text class="rv" x="56" y="58" text-anchor="middle">${esc(val)}</text><text class="rs" x="56" y="76" text-anchor="middle">${esc(sub)}</text></svg>`;
}

/* ---------- number tween ---------- */
const numPrev={};const RM=matchMedia("(prefers-reduced-motion: reduce)");
function cnt(key,v,kind){const f=kind==="rub"?rub:kind==="f1"?fmt1:fmt;return`<span data-cnt="${key}" data-to="${+v||0}" data-k="${kind||""}">${f(v)}</span>`}
function tweenNums(fromZero){
  document.querySelectorAll("[data-cnt]").forEach(el=>{
    const k=el.dataset.cnt,to=+el.dataset.to,from=fromZero?0:(numPrev[k]??to);numPrev[k]=to;
    if(from===to||RM.matches)return;
    const f=el.dataset.k==="rub"?rub:el.dataset.k==="f1"?fmt1:fmt;const t0=performance.now(),D=700;
    const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=f(from+(to-from)*e);if(p<1&&el.isConnected)requestAnimationFrame(step)};
    el.textContent=f(from);requestAnimationFrame(step);
  });
}
/* ---------- focus timer ---------- */
const FT={phase:"work",left:null,running:false,round:1,tick:null,last:0};
function ftLen(ph){const f=S.settings.focus;return(ph==="work"?f.work:ph==="short"?f.short:f.long)*60}
function focusPill(){
  if(FT.left==null)FT.left=ftLen("work");
  const m=Math.floor(FT.left/60),s=FT.left%60;
  const lbl=FT.phase==="work"?(FT.running?"Фокус":"Пауза"):"Перерыв";
  const C=2*Math.PI*14,fr=1-FT.left/ftLen(FT.phase);
  return`<div class="focus-pill" id="fpill"><span class="lbl">${lbl}</span><span class="t">${pad(m)}:${pad(s)}</span><span class="play-w"><button class="play" data-a="ft-toggle" aria-label="${FT.running?"Пауза":"Старт"}">${ic(FT.running?"pause":"play")}</button><svg class="fring" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" stroke-dasharray="${(C*fr).toFixed(1)} ${C.toFixed(1)}"/></svg></span></div>`;
}
function ftUpdate(){const el=$("#fpill");if(el)el.outerHTML=focusPill()}
function ftToggle(){
  FT.running=!FT.running;
  if(FT.running){FT.last=Date.now();FT.tick=setInterval(()=>{
    const now=Date.now(),dt=Math.round((now-FT.last)/1000);if(dt<1)return;FT.last+=dt*1000;FT.left-=dt;
    if(FT.phase==="work"&&dt>0){S.focus.log[today()]=(S.focus.log[today()]||0)+dt/60}
    if(FT.left<=0){
      if(FT.phase==="work"){persist("focus");if(FT.round>=S.settings.focus.rounds){FT.phase="long";FT.round=1}else{FT.phase="short";FT.round++}}
      else FT.phase="work";
      FT.left=ftLen(FT.phase);
    }
    ftUpdate();
  },1000)}else{clearInterval(FT.tick);persist("focus")}
  ftUpdate();
}

function vOverview(){
  const T=today(),d=new Date(),doy=dayOfYear(d),yl=(new Date(d.getFullYear(),11,31)-new Date(d.getFullYear(),0,0))/864e5;
  const sc=dayScore(T),y=dayScore(iso(addDays(d,-1))).score,diff=sc.score-y;
  const wk=Math.ceil(doy/7);
  let ruler="";for(let i=1;i<=53;i++){const firstDay=new Date(d.getFullYear(),0,1+(i-1)*7);ruler+=`<i class="${i<wk?"on":""} ${i===wk?"now":""} ${firstDay.getDate()<=7&&i>1?"m":""}"></i>`}
  const days=[...Array(14)].map((_,i)=>iso(addDays(d,i-13)));
  const vals=days.map(x=>dayScore(x).score);
  const tToday=S.tasks.filter(t=>t.bucket==="today"||(t.due===T));const tDone=tToday.filter(t=>t.done).length;
  const hDone=S.habits.filter(h=>h.log[T]).length;
  const P=plan(),e=eaten(T);
  const ms=monthTx(),sp=spent(ms),spPrev=spent(monthTx(-1).filter(x=>parse(x.date).getDate()<=d.getDate()));
  const focusMin=S.focus.log[T]||0,focusAvg=Object.entries(S.focus.log).filter(([k])=>k<T&&k>=iso(addDays(d,-7))).reduce((a,[,v])=>a+v,0)/7;
  const evs=S.events.filter(x=>x.date>=T).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);

function vHabits(){

function planHtml(){
  const P=plan(),p=S.food.profile;
  if(!P)return`<div class="empty">Заполните пол, возраст, рост и вес, и я посчитаю норму</div>`;
  const dir=P.delta<0?"снижение":P.delta>0?"набор":"поддержание";
  const W=[...Array(6)].map((_,i)=>i/5);
  const realD=P.capped?Math.max(P.days,daysBetween(today(),P.realDate)):P.days;
  const pts=W.map(f=>+p.weight+(+p.target-p.weight)*Math.min(1,f*P.days/realD));
  const labels=W.map(f=>{const x=addDays(new Date(),Math.round(f*Math.max(P.days,1)));return`${x.getDate()}.${pad(x.getMonth()+1)}`});
  return`<div class="stat"><span class="lbl">Норма в день</span><span class="val">${cnt("pk",P.kcal)}<small> ккал</small></span><span class="chg">${P.manual?"задано вручную в настройках":`расход ${fmt(P.tdee)} ккал, ${P.adj?`${P.adj<0?"дефицит":"профицит"} ${fmt(Math.abs(P.adj))}`:"без дефицита"}`}</span></div>
  <div class="kbju"><div><span class="meta">Белки</span><span class="v">${P.prot} г</span></div><div><span class="meta">Жиры</span><span class="v">${P.fat} г</span></div><div><span class="meta">Углеводы</span><span class="v">${P.carb} г</span></div></div>
  ${!P.hasGoal?`<div class="warnbox">${ic("alert","s")}<span>Это норма для поддержания веса. Укажите желаемый вес и дату, и я посчитаю норму под цель</span></div>`:`<div class="list">
    <div class="li"><span class="t">Цель</span><span class="r">${dir}, ${P.delta>0?"+":""}${fmt1(P.delta)} кг</span></div>
    <div class="li"><span class="t">Срок</span><span class="r">${P.days} ${plural(P.days,"день","дня","дней")}, до ${dLabel(p.deadline)}</span></div>
    <div class="li"><span class="t">Темп</span><span class="r">${P.pace>0?"+":""}${fmt1(P.pace)} кг в неделю</span></div>
  </div>`}
  ${P.capped&&!P.manual?`<div class="warnbox">${ic("alert","s")}<span>За этот срок цель достижима только с небезопасным темпом. При безопасном темпе вы придёте к ${fmt1(p.target)} кг примерно ${dLabel(P.realDate)}.</span></div>`:""}
  ${P.delta!==0?lineChart(pts,labels,{h:160,fy:v=>fmt1(v),target:+p.target,targetLabel:"цель",aria:"Прогноз веса"}):""}
  <span class="meta">Расчёт по формуле Миффлина — Сан Жеора, ориентир, а не медицинская рекомендация</span>`;
}

function contextText(){
  const T=today(),d=new Date(),see=S.settings.aiSee,L=[];
  L.push(`Сегодня ${WDL[d.getDay()]}, ${dLabel(T)} ${d.getFullYear()}, время ${pad(d.getHours())}:${pad(d.getMinutes())}.`);
  if(see.tasks){const o=openTasks();L.push(`Задачи открытые (${o.length}): `+o.slice(0,25).map(t=>`${t.title} [${{today:"сегодня",week:"на неделе",later:"потом"}[t.bucket]}${t.due?`, срок ${t.due}`:""}${t.due&&t.due<T?", ПРОСРОЧЕНА":""}]`).join("; "));L.push(`Сделано задач: ${S.tasks.filter(t=>t.done).length}.`)}
  if(see.calendar){const ev=S.events.filter(e=>e.date>=T&&e.date<=iso(addDays(d,7))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));L.push("События на 7 дней: "+(ev.map(e=>`${e.date} ${e.time} ${e.title} (${hm(e.dur||60)})`).join("; ")||"нет"))}
  if(see.habits&&S.habits.length){const d30=[...Array(30)].map((_,i)=>iso(addDays(d,i-29)));L.push("Привычки: "+S.habits.map(h=>`${h.name}: сегодня ${h.log[T]?"да":"нет"}, серия ${streak(h)}, за 30 дней ${d30.filter(x=>h.log[x]).length}/30`).join("; "))}
  if(see.health){const l=hlog(T),P=plan(),e=eaten(T),p=S.food.profile;
    L.push(`Здоровье сегодня: сон ${l.sleep?hm(l.sleep):"не записан"}, вода ${l.water||0} мл из ${S.settings.goals.water}, шаги ${l.steps||0}, настроение ${l.mood||"—"}/5, последний вес ${lastWeight()?lastWeight()+" кг":"не указан"}.`);
    if(P)L.push(`Питание: цель ${p.weight}→${p.target} кг к ${p.deadline}, норма ${P.kcal} ккал (Б ${P.prot} / Ж ${P.fat} / У ${P.carb} г). Съедено сегодня ${e.kcal} ккал (Б ${e.p} / Ж ${e.f} / У ${e.c}): ${meals(T).map(m=>m.name).join(", ")||"ничего"}.`);
    const W=S.workouts.filter(w=>w.date>=iso(addDays(d,-7)));L.push(`Тренировки за 7 дней: ${W.map(w=>`${w.date} ${WTYPES[w.type]?.[0]} ${w.min} мин`).join("; ")||"нет"}. Цель ${S.settings.goals.workouts} в неделю.`)}
  if(see.money){const ms=monthTx(),byCat={};ms.filter(x=>x.type==="exp").forEach(x=>byCat[CATS[x.cat]?.[0]]=(byCat[CATS[x.cat]?.[0]]||0)+(+x.amount));
    L.push(`Финансы за ${MN[d.getMonth()].toLowerCase()}: потрачено ${spent(ms)} ₽, доход ${income(ms)} ₽, прошлый месяц потрачено ${spent(monthTx(-1))} ₽. По категориям: ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${v}`).join(", ")}. На счетах всего ${totalBal()} ₽. Подписки: ${S.money.subs.map(s=>`${s.name} ${s.amount} ₽ (${s.day} числа)`).join(", ")}.`)}
  const off=AISEE.filter(a=>!see[a[0]]).map(a=>a[1]);if(off.length)L.push(`Скрыто от тебя пользователем: ${off.join(", ")}. Если вопрос про это, скажи, что доступ выключен в панели «Что ассистент видит».`);
  return L.join("\n");
}
const AI_RULES=`Ты ассистент в личном приложении «Kwantoww». Отвечай по-русски, коротко и по делу: 1–3 предложения или до 5 коротких пунктов. Сначала прямой ответ, затем один конкретный совет, если он нужен. Без приветствий, без воды, без эмодзи, без markdown-заголовков. Опирайся только на данные ниже, ничего не выдумывай. Если пользователь просит что-то добавить или сообщает, что съел, потратил, выпил воду или запланировал, вызови нужный инструмент, а потом в одной строке скажи, что добавил. Калорийность и БЖУ еды оценивай сам по обычным порциям. Медицинских диагнозов не ставь.`;
function aiTools(acts){
  const done=(k,msg)=>{acts.push(msg);persist(k);return"ok"};
  return[
    {name:"add_task",description:"Добавить задачу",inputSchema:{type:"object",properties:{title:{type:"string"},when:{type:"string",enum:["today","week","later"]},tag:{type:"string",enum:["work","personal","study","home"]},due:{type:"string",description:"YYYY-MM-DD"}},required:["title"]},
      execute:i=>{S.tasks.push({id:rid(),title:String(i.title).slice(0,200),tag:TAGS[i.tag]?i.tag:"personal",bucket:["today","week","later"].includes(i.when)?i.when:"today",due:/^\d{4}-\d\d-\d\d$/.test(i.due||"")?i.due:(i.when==="later"?null:today()),done:false});return done("tasks","задача добавлена")}},
    {name:"add_meal",description:"Записать съеденное сегодня с оценкой КБЖУ",inputSchema:{type:"object",properties:{name:{type:"string"},kcal:{type:"number"},protein:{type:"number"},fat:{type:"number"},carbs:{type:"number"}},required:["name","kcal"]},
      execute:i=>{const T=today();(S.food.meals[T]=S.food.meals[T]||[]).push({id:rid(),name:String(i.name).slice(0,120),kcal:Math.round(+i.kcal||0),p:Math.round(+i.protein||0),f:Math.round(+i.fat||0),c:Math.round(+i.carbs||0)});return done("food","еда записана")}},
    {name:"add_expense",description:"Записать расход",inputSchema:{type:"object",properties:{amount:{type:"number"},category:{type:"string",enum:Object.keys(CATS)},note:{type:"string"}},required:["amount"]},
      execute:i=>{const a=Math.round(+i.amount||0);if(a<=0)throw new Error("Сумма должна быть больше нуля");const acc=S.money.accounts[0];S.money.tx.push({id:rid(),date:today(),type:"exp",amount:a,cat:CATS[i.category]?i.category:"other",note:String(i.note||"").slice(0,120),acc:acc?.id});if(acc)acc.balance-=a;return done("money","расход записан")}},
    {name:"log_water",description:"Добавить выпитую воду в мл",inputSchema:{type:"object",properties:{ml:{type:"number"}},required:["ml"]},
      execute:i=>{const l=S.health.log[today()]=S.health.log[today()]||{};l.water=(l.water||0)+Math.round(+i.ml||0);return done("health","вода записана")}},
    {name:"add_event",description:"Добавить событие в календарь",inputSchema:{type:"object",properties:{title:{type:"string"},date:{type:"string",description:"YYYY-MM-DD"},time:{type:"string",description:"HH:MM"},minutes:{type:"number"}},required:["title","date","time"]},
      execute:i=>{if(!/^\d{4}-\d\d-\d\d$/.test(i.date)||!/^\d\d:\d\d$/.test(i.time))throw new Error("Нужны дата YYYY-MM-DD и время HH:MM");S.events.push({id:rid(),title:String(i.title).slice(0,120),date:i.date,time:i.time,dur:Math.round(+i.minutes||60),tag:"personal"});return done("events","событие добавлено")}},
    {name:"add_note",description:"Создать заметку",inputSchema:{type:"object",properties:{title:{type:"string"},body:{type:"string"}},required:["title"]},
      execute:i=>{S.notes.push({id:rid(),title:String(i.title).slice(0,120),body:String(i.body||""),updated:Date.now(),pinned:false});return done("notes","заметка создана")}}
  ];
}
let sampleNs;
async function ask(q){
  q=q.trim();if(!q||ui.busy)return;
  ui.aiErr="";
  let c=curChat();
  if(!c){c={id:rid(),title:q.slice(0,48),t:Date.now(),msgs:[]};S.chats.unshift(c);ui.chatId=c.id}
  c.msgs.push({role:"user",content:q,t:Date.now()});c.t=Date.now();
  ui.busy=true;ui.newMsg=true;render();
  try{
    if(sampleNs===undefined)sampleNs=window.claude&&window.claude.use?await window.claude.use("sample"):null;
    if(!sampleNs)throw{code:"unavailable"};
    const hist=c.msgs.slice(-12).map(m=>({role:m.role,content:m.content}));
    while(hist.length&&hist[0].role!=="user")hist.shift();
    const lastI=hist.length-1;
    hist[lastI]={role:"user",content:`${AI_RULES}\n\nДанные пользователя:\n${contextText()}\n\nВопрос: ${hist[lastI].content}`};
    const acts=[];
    const res=await sampleNs(hist,{cache:false,tools:aiTools(acts),onText:({text})=>{const p=$("#pending .b");if(p&&text)p.textContent=text}});
    c.msgs.push({role:"assistant",content:(res.text||"").trim()||"Готово",t:Date.now(),acts:acts.join(", ")});ui.newMsg=true;
  }catch(e){
    c.msgs.pop();
    ui.aiErr=e&&e.code==="not_granted"?"Ассистенту не дали доступ. Разрешить можно в меню разрешений этой страницы":e&&e.code==="rate_limited"?"Слишком много вопросов подряд. Попробуйте через минуту":e&&e.code==="unavailable"?"Ассистент работает, когда приложение открыто на claude.ai":"Не получилось получить ответ. Попробуйте ещё раз";
    if(!c.msgs.length){S.chats=S.chats.filter(x=>x!==c);ui.chatId=null}
    if(ui.view==="assistant"){ui.busy=false;render();const a=$("#ask");if(a)a.value=q;return}
  }
  ui.busy=false;
  S.chats=S.chats.slice(0,30);
  commit("chats");
}

function find(k,id){return S[k].find(x=>x.id===id)}
function arm(id){if(ui.armed===id){ui.armed=null;return true}ui.armed=id;clearTimeout(ui.armT);ui.armT=setTimeout(()=>{ui.armed=null;render()},4000);render();return false}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case"theme":S.settings.theme=v;applyTheme();commit("settings");break;
    case"theme-cycle":{const o=["system","light","dark"];S.settings.theme=o[(o.indexOf(S.settings.theme)+1)%3];applyTheme();commit("settings");break}
    case"dark-toggle":{const dark=el.getAttribute("aria-checked")==="true";S.settings.theme=dark?"light":"dark";applyTheme();commit("settings");break}
    case"sys-toggle":S.settings.theme=S.settings.theme==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):"system";applyTheme();commit("settings");break;
    case"sheet-open":$("#sheet").classList.add("open");break;
    case"sheet-close":if(e.target===el||el.tagName==="BUTTON")$("#sheet").classList.remove("open");break;
    case"task-done":{const t=find("tasks",id);t.done=!t.done;ui.flash=`[data-a="task-done"][data-id="${id}"]`;commit("tasks");break}
    case"task-move":{const t=find("tasks",id);const o=["today","week","later"];t.bucket=o[(o.indexOf(t.bucket)+1)%3];if(t.bucket==="today")t.due=today();if(t.bucket==="later")t.due=null;if(t.bucket==="week"&&(!t.due||t.due<=today()))t.due=iso(addDays(new Date(),2));commit("tasks");break}
    case"task-filter":ui.taskTagFilter=v;render();break;
    case"del":{const k=el.dataset.k;if(arm(id)){S[k]=S[k].filter(x=>x.id!==id);commit(k)}break}
    case"meal-del":{if(arm(id)){const T=today();S.food.meals[T]=meals(T).filter(m=>m.id!==id);commit("food")}break}
    case"sub-del":{if(arm(id)){S.money.subs=S.money.subs.filter(x=>x.id!==id);commit("money")}break}
    case"acc-del":{if(arm(id)){S.money.accounts=S.money.accounts.filter(x=>x.id!==id);commit("money")}break}
    case"tx-del":{if(arm(id)){const x=S.money.tx.find(t=>t.id===id);const acc=S.money.accounts.find(q=>q.id===x?.acc);if(acc&&x)acc.balance+=x.type==="inc"?-x.amount:+x.amount;S.money.tx=S.money.tx.filter(t=>t.id!==id);commit("money")}break}
    case"tx-type":ui.txType=v;el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===el));break;
    case"hab":{const h=find("habits",id),d=el.dataset.d;if(h.log[d])delete h.log[d];else h.log[d]=true;ui.flash=`[data-a="hab"][data-id="${id}"][data-d="${d}"]`;commit("habits");break}
    case"water":{const l=S.health.log[today()]=S.health.log[today()]||{};l.water=(l.water||0)+(+v);ui.flash=`[data-a="water"][data-v="${v}"]`;commit("health");break}
    case"mood":{const l=S.health.log[today()]=S.health.log[today()]||{};l.mood=+v;ui.flash=`[data-a="mood"][data-v="${v}"]`;commit("health");break}
    case"body-tab":ui.bodyTab=v;render();break;
    case"use-weight":S.food.profile.weight=lastWeight();commit("food");break;
    case"cal-shift":{const narrow=matchMedia("(max-width:760px)").matches;ui.calSel=iso(addDays(parse(ui.calSel),(+v)*(narrow?1:7)));render();break}
    case"cal-month":{const d=parse(ui.calSel);ui.calSel=iso(new Date(d.getFullYear(),d.getMonth()+(+v),1));render();break}
    case"cal-pick":ui.calSel=el.dataset.d;render();break;
    case"cal-slot":if(e.target===el){ui.calSel=el.dataset.d;const r=el.getBoundingClientRect();const min=Math.floor(((e.clientY-r.top)/48*60)/30)*30+7*60;render();const f=$('form[data-f="ev-add"]');if(f){f.time.value=`${pad(Math.floor(min/60))}:${pad(min%60)}`;f.title.focus()}}break;
    case"ev-del":{if(arm(id)){S.events=S.events.filter(x=>x.id!==id);commit("events")}break}
    case"note-new":{const n={id:rid(),title:"",body:"",updated:Date.now(),pinned:false};S.notes.push(n);ui.noteId=n.id;ui.noteEditing=true;ui.noteQ="";commit("notes");setTimeout(()=>$("#noteTitle")?.focus(),0);break}
    case"note-open":ui.noteId=id;ui.noteEditing=true;render();break;
    case"note-back":ui.noteEditing=false;render();break;
    case"note-pin":{const n=find("notes",ui.noteId);n.pinned=!n.pinned;commit("notes");break}
    case"ask":ask(v);break;
    case"chat-new":ui.chatId="__new";ui.aiErr="";render();setTimeout(()=>$("#ask")?.focus(),0);break;
    case"chat-open":ui.chatId=id;render();break;
    case"see":S.settings.aiSee[v]=!S.settings.aiSee[v];ui.flash=`[data-a="see"][data-v="${v}"]`;commit("settings");break;
    case"ft-toggle":ftToggle();break;
    case"ft-reset":clearInterval(FT.tick);FT.running=false;FT.phase="work";FT.round=1;FT.left=ftLen("work");render();break;
    case"clear-demo":if(arm("demo")){const st=S.settings;applyLoaded(null);S.settings=st;S.meta.demo=false;KEYS.forEach(persist);render()}break;
  }
});
document.addEventListener("submit",e=>{
  const f=e.target;const k=f.dataset.f;if(!k)return;e.preventDefault();
  const v=n=>(f.elements[n]?.value??"").trim();
  switch(k){
    case"task-add":if(!v("title"))return;S.tasks.push({id:rid(),title:v("title"),tag:"personal",bucket:f.dataset.bucket,due:f.dataset.bucket==="today"?today():f.dataset.bucket==="week"?iso(addDays(new Date(),3)):null,done:false});commit("tasks");refocus(`form[data-f="task-add"][data-bucket="${f.dataset.bucket}"] input`);break;
    case"task-add-full":{const due=v("due")||null;const T=today();const b=!due||due<=T?"today":daysBetween(T,due)<=7?"week":"later";S.tasks.push({id:rid(),title:v("title"),tag:v("tag"),bucket:b,due,done:false});commit("tasks");refocus('form[data-f="task-add-full"] input[name=title]');break}
    case"ev-add":S.events.push({id:rid(),title:v("title"),date:ui.calSel,time:v("time")||"12:00",dur:+v("dur")||60,tag:v("tag")});commit("events");break;
    case"hab-add":S.habits.push({id:rid(),name:v("name"),color:S.habits.length%HCOL.length,log:{}});commit("habits");break;
    case"hlog":{const key=f.dataset.k;let x=parseFloat(v("v").replace(",","."));if(isNaN(x))return;const l=S.health.log[today()]=S.health.log[today()]||{};
      if(key==="sleep")l.sleep=Math.round(x*60);else if(key==="steps")l.steps=Math.round(x);else if(key==="weight"){l.weight=Math.round(x*10)/10;S.food.profile.weight=l.weight;persist("food")}
      commit("health");break}
    case"meal-add":{const T=today();(S.food.meals[T]=S.food.meals[T]||[]).push({id:rid(),name:v("name"),kcal:+v("kcal")||0,p:+v("p")||0,f:+v("f")||0,c:+v("c")||0});commit("food");refocus('form[data-f="meal-add"] input[name=name]');break}
    case"gym-add":S.workouts.push({id:rid(),type:v("type"),min:+v("min")||30,date:v("date")||today(),note:v("note")});commit("workouts");break;
    case"tx-add":{const amt=Math.round(+v("amount")||0);if(amt<=0)return;const type=ui.txType||"exp";const x={id:rid(),date:v("date")||today(),type,amount:amt,cat:v("cat"),note:v("note"),acc:v("acc")};S.money.tx.push(x);const acc=S.money.accounts.find(a=>a.id===x.acc);if(acc)acc.balance+=type==="inc"?amt:-amt;commit("money");break}
    case"sub-add":S.money.subs.push({id:rid(),name:v("name"),amount:+v("amount")||0,day:clamp(+v("day")||1,1,28)});commit("money");break;
    case"acc-add":S.money.accounts.push({id:rid(),name:v("name"),balance:+v("balance")||0});commit("money");break;
    case"ask":{const q=v("q");f.elements.q.value="";ask(q);break}
  }
});
function refocus(sel){setTimeout(()=>$(sel)?.focus(),0)}
document.addEventListener("keydown",e=>{
  if(e.target.id==="ask"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();e.target.form.requestSubmit()}
  if(e.key==="Escape")$("#sheet").classList.remove("open");
});
let profT;
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.closest("#profileForm")){const p=S.food.profile;p[t.name]=t.type==="number"?parseFloat(t.value)||0:t.value;const box=$("#planBox");if(box)box.innerHTML=planHtml();clearTimeout(profT);profT=setTimeout(()=>persist("food"),400);return}
  if(t.id==="noteTitle"||t.id==="noteBody"){const n=find("notes",ui.noteId);if(!n)return;n[t.id==="noteTitle"?"title":"body"]=t.value;n.updated=Date.now();persist("notes");
    const q=ui.noteQ.toLowerCase();const list=S.notes.filter(x=>!q||(x.title+" "+x.body).toLowerCase().includes(q)).sort((a,b)=>(b.pinned-a.pinned)||(b.updated-a.updated));$("#noteItems").innerHTML=noteItems(list);const sv=$("#noteSaved");if(sv)sv.textContent="сохранено";return}
  if(t.id==="noteQ"){ui.noteQ=t.value;const q=t.value.toLowerCase();$("#noteItems").innerHTML=noteItems(S.notes.filter(x=>!q||(x.title+" "+x.body).toLowerCase().includes(q)).sort((a,b)=>(b.pinned-a.pinned)||(b.updated-a.updated)));return}
  if(t.id==="ask"){t.style.height="40px";t.style.height=Math.min(140,t.scrollHeight)+"px"}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.closest("#profileForm")){render();return}
  if(t.dataset.acc){const a=S.money.accounts.find(x=>x.id===t.dataset.acc);if(a){a.balance=+t.value||0;commit("money")}return}
  if(t.dataset.set){const path=t.dataset.set,val=t.value;const s=S.settings;
    if(path==="accent"){s.accent=val;applyTheme()}
    else if(path.startsWith("focus.")){s.focus[path.slice(6)]=+val;if(!FT.running){FT.left=ftLen(FT.phase)}}
    else if(path==="goals.sleepH")s.goals.sleep=Math.round((parseFloat(val)||8)*60);
    else if(path.startsWith("goals."))s.goals[path.slice(6)]=+val||0;
    commit("settings")}
});
matchMedia("(max-width:760px)").addEventListener?.("change",()=>{if(ui.view==="calendar")render()});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(ui.view==="prefs")render()});
setInterval(()=>{if(ui.view==="calendar"&&!document.activeElement?.matches("input,textarea,select"))render()},60000);

boot();
</script>
