name = "kwantoww-ai"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGIN = "https://usmanovhursed29-bot.github.io"
GEMINI_MODEL = "gemini-flash-lite-latest,gemini-3.5-flash,gemini-flash-latest"
DAILY_LIMIT = "20"
# Подписка Kwantoww Plus: цена в звёздах Telegram за 30 дней, бесплатные вопросы ИИ в день
PREMIUM_STARS = "150"
FREE_AI_PER_DAY = "3"
# Кто видит /admin: Telegram ID через запятую (узнать командой /myid в боте)
ADMIN_IDS = "7041620841"
APP_URL = "https://usmanovhursed29-bot.github.io/Claude/"

[[kv_namespaces]]
binding = "LIMITS"
id = "a9cf791842ee4a1fa560a875dd6476ae"

# Пользователи, статистика и записи из чата. Создать: npx wrangler d1 create kwantoww,
# вписать id ниже, затем: npx wrangler d1 execute kwantoww --remote --file schema.sql
[[d1_databases]]
binding = "DB"
database_name = "kwantoww"
database_id = "73812776-bba2-4c92-8f90-c3a23ad66d6c"

# Напоминания о событиях: проверка раз в минуту
[triggers]
crons = ["* * * * *"]
