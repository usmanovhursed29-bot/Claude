<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Kwantoww — ролик 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&display=block">
<style>
/* Ролик 2: настоящий скриншот чата (от владельца) + настоящие кадры приложения Kwantoww (capture-app.cjs).
   Всё состояние кадра считает renderAt(t). Камера двигается только в трёх местах. */
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #08070f; }
* { box-sizing: border-box; }
#stage { position: absolute; inset: 0; overflow: hidden; font-family: Inter, "Noto Color Emoji", sans-serif; color: #fff; }
.disp { font-family: Unbounded, Inter, sans-serif; }
#bg { position: absolute; inset: -200px; background: radial-gradient(110% 70% at 50% 25%, #26205c 0%, #120e2e 50%, #07060f 100%); }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; }
#cam { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 540px 1000px; }
#rig { position: absolute; left: 540px; top: 1000px; transform-style: preserve-3d; }
#phone { position: absolute; left: -360px; top: -760px; width: 720px; height: 1520px; border-radius: 104px;
  background: linear-gradient(145deg, #3a3d46, #121318 40%, #2a2c33); padding: 16px;
  box-shadow: inset 0 0 0 3px #50535c, inset 0 0 0 9px #0b0c0f, 0 60px 140px rgba(0,0,0,.6); }
#screen { position: relative; width: 688px; height: 1488px; border-radius: 88px; overflow: hidden; background: #000; }
#island { position: absolute; left: 50%; top: 22px; width: 190px; height: 56px; margin-left: -95px; border-radius: 30px; background: #000; z-index: 50; }
#chat { position: absolute; left: 0; top: 0; width: 688px; height: 1492px; }
#dim { position: absolute; inset: 0; background: #000; opacity: 0; }
#topStatus { position: absolute; left: 0; top: 0; width: 688px; height: 110px; opacity: 0; }
#sheet { position: absolute; left: 0; top: 110px; width: 688px; height: 1378px; }
#topSheet { position: absolute; left: 0; top: 0; width: 688px; height: 134.2px; }
#app { position: absolute; left: 0; top: 134.2px; width: 688px; height: 1243.8px; overflow: hidden; background: #1b1b1b; }
#app img { position: absolute; left: 0; top: 0; width: 688px; }
.bar { position: absolute; left: 0; width: 688px; overflow: hidden; }
#splash { position: absolute; inset: 0; background: #1b1b1b; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
#splash .ic { width: 112px; height: 112px; border-radius: 28px; background: #ebe8e3; color: #1b1b1b; display: grid; place-items: center; font: 500 42px ui-monospace, "DejaVu Sans Mono", monospace; }
#splash .h { font: 500 50px Inter, sans-serif; color: #f2f2f2; }
#splash .s { font: 400 26px Inter, sans-serif; color: #8a8a8a; }
.hl { position: absolute; border-radius: 34px; box-shadow: 0 0 0 5px #6cf0c8, 0 0 40px 10px rgba(108,240,200,.45); opacity: 0; }
#finger { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: rgba(255,255,255,.88);
  box-shadow: 0 8px 24px rgba(0,0,0,.45), inset 0 0 0 3px rgba(0,0,0,.08); z-index: 70; opacity: 0; }
#ripple { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; border: 5px solid rgba(255,255,255,.9); z-index: 69; opacity: 0; }
#cap { position: absolute; left: 0; right: 0; top: 112px; text-align: center; z-index: 80; }
#cap .pill { display: inline-block; max-width: 1000px; padding: 22px 38px 26px; border-radius: 50px; background: rgba(14,11,34,.82); box-shadow: 0 18px 50px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.08); }
.cw { display: inline-block; font-weight: 800; font-size: 56px; line-height: 1.12; letter-spacing: -0.02em; margin: 0 9px; }
.g { color: #7ef0c6; }
#hook { position: absolute; left: 50px; right: 50px; top: 470px; text-align: center; z-index: 90; }
#hook .w { display: block; font-weight: 900; font-size: 112px; line-height: 1.04; letter-spacing: -0.03em; }
#hook .w.y { color: #7ef0c6; }
#end { position: absolute; left: 0; right: 0; top: 520px; text-align: center; z-index: 90; }
#logo { font-weight: 900; font-size: 126px; letter-spacing: -0.04em; }
#logo span { display: inline-block; }
#sub { font-weight: 700; font-size: 48px; margin-top: 26px; color: #dfe4ff; }
#cta { display: inline-block; margin-top: 64px; padding: 32px 50px; border-radius: 80px; background: linear-gradient(135deg, #2fb8ff, #3390ec 55%, #6a5cff); font-weight: 800; font-size: 44px; box-shadow: 0 20px 60px rgba(51,144,236,.5); }
#feat { margin-top: 44px; font-weight: 700; font-size: 34px; color: #b9c3ff; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="blobs"></div>
  <div id="cam"><div id="rig"><div id="phone"><div id="screen">
    <img id="chat" src="assets/chat.jpg">
    <div class="hl" id="hl1" style="left:14px;top:268px;width:582px;height:378px"></div>
    <div class="hl" id="hl2" style="left:14px;top:794px;width:526px;height:332px"></div>
    <div class="hl" id="hl3" style="left:14px;top:648px;width:582px;height:72px;border-radius:24px"></div>
    <div id="dim"></div>
    <img id="topStatus" src="assets/top_status.png">
    <div id="sheet">
      <img id="topSheet" src="assets/top_sheet.png">
      <div id="app">
        <img id="imgA"><img id="imgB">
        <div class="bar" id="barT"><img id="barTi"></div>
        <div class="bar" id="barB"><img id="barBi"></div>
        <div id="splash"><div class="ic">kw</div><div class="h">Доброе утро, Тимур</div><div class="s">Посмотрим, как проходит день</div></div>
      </div>
    </div>
    <div id="ripple"></div><div id="finger"></div>
    <div id="island"></div>
  </div></div></div></div>
  <div id="hook" class="disp"></div>
  <div id="cap" class="disp"></div>
  <div id="end" class="disp"><div id="logo"></div><div id="sub">Бесплатный бот в Telegram</div><div id="cta">Найди Kwantoww в Telegram</div><div id="feat">Задачи · Календарь · Привычки · Итоги недели</div></div>
</div>
<script src="app-steps/steps.js"></script>
<script>
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => cl((t - a) / (b - a));
const E = { out: (x) => 1 - Math.pow(1 - x, 3), io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  back: (x) => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); } };
const lerp = (a, b, x) => a + (b - a) * x;
const $ = (id) => document.getElementById(id);
const K = 688 / 390;            // CSS px приложения → px экрана
const APP_TOP = 110 + 134.2;    // верх области приложения на экране
let STEPS, BARS;

// ---------- камера: три движения, между ними неподвижно ----------
const CAM = [ // [начало, конец, ty, s, rx]
  [0, 1.5, 1900, 0.92, 18],
  [1.5, 2.45, 50, 0.92, 0],
  [3.25, 4.15, 240, 1.24, 0],
  [4.85, 5.5, -120, 1.18, 0],
  [6.75, 7.45, 115, 1.02, 0],
  [21.7, 22.75, 640, 0.6, 14],
];
function cam(t) {
  let st = { ty: CAM[0][2], s: CAM[0][3], rx: CAM[0][4] };
  for (let i = 1; i < CAM.length; i++) {
    const [a, b, ty, s, rx] = CAM[i];
    if (t <= a) break;
    const e = E.io(P(t, a, b));
    st = { ty: lerp(st.ty, ty, e), s: lerp(st.s, s, e), rx: lerp(st.rx, rx, e) };
  }
  return st;
}

// ---------- кадры приложения ----------
const typed = Array.from({ length: 15 }, (_, i) => [9.22 + i * 0.09, `type_${String(i + 1).padStart(2, "0")}`, 0]);
const APP = [ // [время, имя кадра, длительность перехода]
  [7.95, "overview", 0.25], [8.88, "task_open", 0.14], ...typed, [11.03, "task_saved", 0.12],
  [11.9, "scroll:long_overview:0:442:0.7:water_view", 0], [12.95, "water_open", 0.12], [13.6, "water_saved", 0.12],
  [14.3, "habits_before", 0.2], [14.66, "habits", 0.16], [15.1, "scroll:long_habits:0:461:0.55:habits_scrolled", 0], [15.95, "habit_done", 0.1],
  [16.5, "calendar_before", 0.15], [16.86, "calendar", 0.16], [17.45, "calendar_events", 0.35],
  [18.3, "health_before", 0.12], [18.66, "health", 0.16], [19.7, "tasks_before", 0.12], [20.06, "tasks", 0.16],
  [20.55, "scroll:long_tasks:0:520:0.5:tasks_list", 0],
];
const TAPS = [ // [время, экранные x, y]
  [6.45, 304, 683, "chat"],
  [8.82, "task_open"], [10.98, "task_saved"], [12.9, "water_open"], [13.55, "water_saved"],
  [14.6, "habits"], [15.9, "habit_done"], [16.8, "calendar"], [18.6, "health"], [20.0, "tasks"],
];
const CAPS = [
  [2.55, 4.8, ["Пишешь", "боту", "<span class='g'>как другу</span>"]],
  [4.9, 6.85, ["Бот сам ставит", "<span class='g'>в календарь</span>"]],
  [6.95, 8.65, ["Приложение —", "<span class='g'>одной кнопкой</span>"]],
  [8.75, 11.7, ["Задача", "за", "<span class='g'>2 секунды</span>"]],
  [11.8, 14.2, ["Вода —", "<span class='g'>одним касанием</span>"]],
  [14.3, 16.4, ["Привычки", "и", "<span class='g'>серии</span>", "🔥"]],
  [16.5, 18.2, ["Календарь", "<span class='g'>с напоминаниями</span>"]],
  [18.3, 19.6, ["Счёт дня", "и", "<span class='g'>здоровье</span>"]],
  [19.7, 21.6, ["Всё записанное —", "<span class='g'>уже здесь</span>"]],
];
const HOOK = ["Пиши боту —", "он сам всё", "<span>запишет</span>"];

function stepFile(name) { const s = STEPS.find((x) => x.name === name); return s ? "app-steps/" + s.file : null; }
function tapPoint(name) { const s = STEPS.find((x) => x.name === name); return s && s.tap ? [s.tap.x * K, APP_TOP + s.tap.y * K] : null; }

function build() {
  $("blobs").innerHTML = [["#5b3df5", 560, 80, 180], ["#13c2a3", 460, 640, 1400], ["#ff4fa0", 380, -60, 1150], ["#2f8cff", 460, 760, 420]]
    .map(([c, s, x, y], i) => `<div class="blob" id="bl${i}" style="background:${c};width:${s}px;height:${s}px;left:${x}px;top:${y}px"></div>`).join("");
  $("hook").innerHTML = HOOK.map((w, i) => `<span class="w${i === 2 ? " y" : ""}" id="h${i}">${w}</span>`).join("");
  $("logo").innerHTML = "Kwantoww".split("").map((c, i) => `<span id="L${i}">${c}</span>`).join("");
}

// предзагрузка всех кадров
async function preload() {
  STEPS = window.STEPS_JSON;
  BARS = STEPS.bars; STEPS = STEPS.steps;
  const files = new Set(STEPS.map((s) => "app-steps/" + s.file).concat(["app-steps/long_overview.png", "app-steps/long_habits.png", "app-steps/long_tasks.png"]));
  await Promise.all([...files].map((f) => new Promise((r) => { const im = new Image(); im.onload = r; im.onerror = r; im.src = f; })));
}

function setImg(el, src) { if (el.dataset.src !== src) { el.src = src; el.dataset.src = src; } }

function renderApp(t) {
  const A = $("imgA"), B = $("imgB"), bt = $("barT"), bb = $("barB");
  bt.style.display = bb.style.display = "none";
  let i = -1;
  for (let k = 0; k < APP.length; k++) if (t >= APP[k][0]) i = k;
  if (i < 0) { A.style.opacity = 0; B.style.opacity = 0; return; }
  const [t0, name, dur] = APP[i];
  if (name.startsWith("scroll:")) {
    const [, long, from, to, d, after] = name.split(":");
    const q = P(t, t0, t0 + Number(d));
    if (q >= 1) { setImg(A, stepFile(after)); A.style.top = "0px"; A.style.opacity = 1; B.style.opacity = 0; return; }
    const y = lerp(Number(from), Number(to), E.io(q));
    setImg(A, `app-steps/${long}.png`); A.style.top = `${-y * K}px`; A.style.opacity = 1; B.style.opacity = 0;
    // закреплённые шапка и нижние вкладки остаются на месте
    const bar = stepFile(after);
    setImg($("barTi"), bar); setImg($("barBi"), bar);
    bt.style.display = bb.style.display = "";
    bt.style.top = "0px"; bt.style.height = `${BARS.top * K}px`; $("barTi").style.top = "0px";
    bb.style.top = `${BARS.bottom * K}px`; bb.style.height = `${(707 - BARS.bottom) * K}px`; $("barBi").style.top = `${-BARS.bottom * K}px`;
    return;
  }
  setImg(B, stepFile(name)); B.style.top = "0px";
  // предыдущий кадр под ним — для мягкой смены
  let prev = null;
  if (i > 0) { const pn = APP[i - 1][1]; prev = pn.startsWith("scroll:") ? stepFile(pn.split(":")[5]) : stepFile(pn); }
  const q = dur > 0 ? E.out(P(t, t0, t0 + dur)) : 1;
  if (prev && q < 1) { setImg(A, prev); A.style.top = "0px"; A.style.opacity = 1; } else A.style.opacity = 0;
  B.style.opacity = q;
}

function renderAt(t) {
  // фон: медленный дрейф
  for (let i = 0; i < 4; i++) $("bl" + i).style.transform = `translate(${Math.sin(t * 0.25 + i) * 40}px, ${Math.cos(t * 0.2 + i * 2) * 50}px)`;
  const c = cam(t);
  $("rig").style.transform = `translate3d(0, ${c.ty}px, 0) rotateX(${c.rx}deg) scale(${c.s})`;

  // подсветки в чате
  const pulse = (a, b) => (t > a && t < b ? Math.min(P(t, a, a + 0.25), 1 - P(t, b - 0.25, b)) : 0);
  $("hl1").style.opacity = pulse(3.75, 4.95);
  $("hl2").style.opacity = pulse(5.45, 6.2);
  $("hl3").style.opacity = pulse(6.0, 6.75) * (0.75 + 0.25 * Math.sin(t * 14));

  // открытие мини-приложения: шторка снизу, чат затемняется
  const up = E.out(P(t, 7.1, 7.55));
  $("dim").style.opacity = 0.6 * P(t, 7.1, 7.4);
  $("topStatus").style.opacity = P(t, 7.25, 7.5);
  $("sheet").style.transform = `translateY(${(1 - up) * 1400}px)`;
  $("sheet").style.display = t >= 7.1 ? "" : "none";
  $("splash").style.opacity = t < 7.95 ? 1 : 1 - P(t, 7.95, 8.2);
  $("splash").style.display = t < 8.2 ? "" : "none";
  renderApp(t);

  // палец: подходит к цели по дуге, нажимает, ripple
  const fg = $("finger"), rp = $("ripple");
  fg.style.opacity = 0; rp.style.opacity = 0;
  const pts = TAPS.map(([tt, x, y, n]) => typeof x === "string" ? [tt, ...(tapPoint(x) || [0, 0])] : [tt, x, y]);
  for (let k = 0; k < pts.length; k++) {
    const [tt, x, y] = pts[k];
    const [pt, px, py] = k > 0 && tt - pts[k - 1][0] < 2.2 ? pts[k - 1] : [tt - 0.7, x + 140, y + 260];
    const startMove = Math.max(pt + 0.15, tt - 0.55);
    if (t >= startMove && t <= tt + 0.35) {
      const m = E.io(P(t, startMove, tt - 0.05));
      const arc = Math.sin(m * Math.PI) * -60;
      fg.style.left = lerp(px, x, m) + "px"; fg.style.top = lerp(py, y, m) + arc + "px";
      const press = t > tt - 0.05 && t < tt + 0.12 ? 0.8 : 1;
      const next = pts[k + 1];
      const leaving = !next || next[0] - tt >= 2.2 ? P(t, tt + 0.15, tt + 0.35) : 0;
      fg.style.opacity = cl(P(t, startMove, startMove + 0.15)) * (1 - leaving) * 0.95;
      fg.style.transform = `scale(${press})`;
      const r = P(t, tt, tt + 0.4);
      if (r > 0 && r < 1) { rp.style.left = x + "px"; rp.style.top = y + "px"; rp.style.opacity = 1 - r; rp.style.transform = `scale(${1 + r * 1.4})`; }
    }
  }

  // хук
  const gone = E.io(P(t, 1.9, 2.4));
  HOOK.forEach((w, i) => {
    const a = E.back(P(t, 0.12 + i * 0.28, 0.6 + i * 0.28)), el = $("h" + i);
    el.style.opacity = t < 2.45 ? cl(a * 2) * (1 - gone) : 0;
    el.style.transform = `translateY(${(1 - a) * 80 - gone * 120}px) scale(${0.85 + 0.15 * a})`;
    el.style.filter = gone > 0 ? `blur(${gone * 8}px)` : "";
  });

  // подписи
  const cap = $("cap"), cc = CAPS.find((x) => t >= x[0] && t < x[1]);
  if (cc) {
    if (cap.dataset.k !== String(cc[0])) { cap.innerHTML = `<div class="pill">${cc[2].map((w) => `<span class="cw">${w}</span>`).join("")}</div>`; cap.dataset.k = String(cc[0]); }
    const pill = cap.firstChild, pa = E.out(P(t, cc[0], cc[0] + 0.3)), po = E.io(P(t, cc[1] - 0.22, cc[1]));
    pill.style.opacity = pa * (1 - po);
    pill.style.transform = `translateY(${(1 - pa) * 24 - po * 20}px) scale(${0.96 + 0.04 * pa})`;
    [...pill.children].forEach((el, i) => { const a = E.out(P(t, cc[0] + 0.05 + i * 0.07, cc[0] + 0.4 + i * 0.07)); el.style.opacity = a; el.style.transform = `translateY(${(1 - a) * 26}px)`; });
  } else { cap.innerHTML = ""; cap.dataset.k = ""; }

  // финал
  $("end").style.display = t >= 22.0 ? "" : "none";
  if (t >= 22.0) {
    "Kwantoww".split("").forEach((ch, i) => { const a = E.back(P(t, 22.1 + i * 0.05, 22.55 + i * 0.05)), el = $("L" + i); el.style.opacity = cl(a * 2); el.style.transform = `translateY(${(1 - a) * 90}px)`; });
    const sa = E.out(P(t, 22.6, 23.0)), ca = E.back(P(t, 22.85, 23.3)), fa = E.out(P(t, 23.1, 23.5));
    $("sub").style.opacity = sa; $("sub").style.transform = `translateY(${(1 - sa) * 30}px)`;
    $("cta").style.opacity = ca; $("cta").style.transform = `scale(${0.8 + 0.2 * ca})`;
    $("feat").style.opacity = fa;
  }
  $("phone").style.filter = t > 21.9 ? `brightness(${1 - P(t, 21.9, 22.8) * 0.5})` : "";
}
window.__ready = Promise.all([document.fonts.ready, preload()]).then(() => { build(); renderAt(0); return true; });
window.renderAt = renderAt;
</script>
</body>
</html>
