  { t: 13.25, x: 0, y: 0, el: "k8" },
];

// ---------- построение DOM ----------
function build() {
  const apps = [["📞", "#34c759", "Телефон"], ["💬", "#30d158", "Сообщения"], ["📷", "#8e8e93", "Камера"], ["🖼", "#fff", "Фото"],
    ["🗺", "#e9f3ff", "Карты"], ["🎵", "#ff2d55", "Музыка"], ["☁️", "#5ac8fa", "Погода"], ["📒", "#ffcc00", "Заметки"],
    ["⏰", "#1c1c1e", "Часы"], ["TG", "", "Telegram"], ["🛒", "#0a84ff", "App Store"], ["⚙️", "#8e8e93", "Настройки"]];
  $("grid").innerHTML = apps.map(([e, c, n]) => `<div class="app">${e === "TG" ? TG_ICON.replace('class="ico"', 'class="ico" id="tgapp"') : `<div class="ico" style="background:${c}">${e}</div>`}<span>${n}</span></div>`).join("");
  $("dock").innerHTML = ["📞", "🧭", "💬", "🎵"].map((e, i) => `<div class="ico" style="background:${["#34c759", "#0a84ff", "#30d158", "#ff2d55"][i]}">${e}</div>`).join("");
  $("nicon").innerHTML = PLANE;
  const rows = [
    ["K", "linear-gradient(135deg,#6a5cff,#2fc7a5)", "Kwantoww", "9:41", "☀️ Доброе утро! Как вы поспали?", "1", true],
    ["М", "linear-gradient(135deg,#ff885e,#ff516a)", "Мама", "9:30", "Купи хлеба по дороге 🙏", "2"],
    ["Д", "linear-gradient(135deg,#72d5fd,#2a9ef1)", "Денис", "9:12", "Го в зал вечером?", ""],
    ["Р", "linear-gradient(135deg,#a0de7e,#54cb68)", "Работа", "8:57", "Аня: созвон перенесли на 15:00", "5"],
    ["🔖", "linear-gradient(135deg,#72d5fd,#2a9ef1)", "Избранное", "вчера", "Список покупок", ""],
    ["А", "linear-gradient(135deg,#e0a2f3,#d669ed)", "Аня", "вчера", "Спасибо!! 😊", ""],
    ["С", "linear-gradient(135deg,#ffcd6a,#ffa85c)", "Спорт клуб", "вчера", "Тренер: расписание на неделю", ""],
  ];
  $("rows").innerHTML = rows.map(([a, g, n, tm, m, b, pin]) => `<div class="row${pin ? " pin" : ""}" ${pin ? 'id="kwrow"' : ""}><div class="av" style="background:${g}">${a}</div><div class="rc"><div class="rn"><span>${n}</span><span>${tm}</span></div><div class="rm"><span class="txt">${m}</span>${b ? `<span class="badge">${b}</span>` : pin ? '<span style="font-size:26px;color:#a0a6ad">📌</span>' : ""}</div></div></div>`).join("");
  // узор обоев чата
  let pat = "";
  const shapes = ["M0 0 l14 0 l-7 12z", "M0 6 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0", "M0 0 l12 12 M12 0 l-12 12", "M0 8 q6 -10 12 0 q6 10 12 0"];
  for (let i = 0; i < 90; i++) {
    const x = (i * 157) % 688, y = (i * 263) % 1488, s = shapes[i % 4];
    pat += `<path d="${s}" transform="translate(${x},${y}) rotate(${(i * 47) % 360}) scale(2.4)" fill="none" stroke="#2c4a2c" stroke-width="1.4"/>`;
  }
  $("pattern").innerHTML = pat;
  // сообщения
  $("msgs").innerHTML = MSGS.map((m) => {
    let body = m.html || "";
    if (m.voice) body = `<div class="voice"><div class="play">▶</div><div class="wave">${Array.from({ length: 26 }, (_, i) => `<i style="height:${10 + Math.abs(Math.sin(i * 1.7)) * 36}px"></i>`).join("")}</div><span style="font-size:22px;color:#5aa05a">0:04</span></div>`;
    if (m.kb) body += `<div class="kb">${["5 ч", "6 ч", "7 ч", "8 ч", "9 ч", "10 ч"].map((x) => `<div ${x === "8 ч" ? 'id="k8"' : ""}>${x}</div>`).join("")}</div>`;
    if (m.report) body = `📬 <b>Ваш отчёт недели</b>\n\n😴 Сон: в среднем <b id="r1">7,4</b> ч\n👟 Шаги: в среднем <b id="r2">8 900</b>\n   цель — 5 из 7 дн.\n💧 Вода: норма — 6 из 7 дн.\n✅ Задач сделано: <b id="r3">12</b>\n\nХорошей новой недели! 💪`;
    if (m.board) body = `🏃 <b>Челлендж шагов</b>\n\n<span id="md1">🥇</span> Вы ⭐ — 62 300\n<span id="md2">🥈</span> Денис — 54 800\n<span id="md3">🥉</span> Аня — 47 300`;
    return `<div class="m ${m.side}" id="${m.id}">${body}<span class="tm">${m.tm}${m.side === "out" ? " ✓✓" : ""}</span></div>`;
  }).join("");
  // фон: пятна и искры (детерминированно)
  const blobs = [["#5b3df5", 520, 120, 260], ["#13c2a3", 420, 820, 1500], ["#ff4fa0", 360, 60, 1200], ["#2f8cff", 480, 700, 300]];
  $("bg1").innerHTML = blobs.map(([c, s, x, y]) => `<div class="blob" style="background:${c};width:${s}px;height:${s}px;left:${x}px;top:${y}px"></div>`).join("");
  let sp = "";
  for (let i = 0; i < 40; i++) sp += `<div class="spark" style="left:${(i * 379) % 1080}px;top:${(i * 617) % 1920}px;opacity:${0.3 + ((i * 7) % 10) / 20};transform:scale(${0.5 + (i % 3) * 0.4})"></div>`;
  $("bg2").innerHTML = sp;
  let sp3 = "";
  for (let i = 0; i < 14; i++) sp3 += `<div class="blob" style="background:${["#8a7bff", "#2fe0b8", "#ff8acb"][i % 3]};width:${60 + (i % 4) * 30}px;height:${60 + (i % 4) * 30}px;left:${(i * 281) % 1080}px;top:${(i * 491) % 1920}px;filter:blur(${8 + (i % 3) * 6}px);opacity:.5"></div>`;
  $("bg3").innerHTML = sp3;
  // карточки недели
  const cards = [["😴", "7,4 ч", "сон в среднем", -290, -430, 260], ["👟", "62 300", "шагов за неделю", 290, -170, 340], ["💧", "14 л", "воды за неделю", -290, 200, 300], ["✅", "12", "задач сделано", 290, 470, 230]];
  $("cards").innerHTML = cards.map(([e, v, l], i) => `<div class="card3" id="c${i}"><div class="e">${e}</div><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
  window.CARDS = cards;
  $("hook").innerHTML = HOOK.map((w, i) => `<span class="w${i === 3 ? " y" : ""}" id="h${i}">${w}</span>`).join("");
  $("logo").innerHTML = "Kwantoww".split("").map((c, i) => `<span id="L${i}">${c}</span>`).join("");
  // высоты сообщений для плавной прокрутки
  window.H = {};
  for (const m of MSGS) window.H[m.id] = $(m.id).offsetHeight + 12;
}

// ---------- кадр ----------
function show(el, on) { el.style.display = on ? "" : "none"; }
function renderAt(t) {
  // камера
  let [x, y, s, rx, ry, rz] = cam(t);
  // вздрагивание телефона при уведомлении (вибрация)
  const vib = P(t, 14.55, 15.0);
  if (vib > 0 && vib < 1) rz += Math.sin(vib * Math.PI * 10) * 2.2 * (1 - vib);
  $("rig").style.transform = `translate3d(${x}px, ${y}px, 0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
  // параллакс фона: дальние слои двигаются меньше, глубина резкости — сильнее размываются на крупном плане
  const z = cl((s - 1) / 0.45, 0, 1);
  $("bg1").style.transform = `translate(${-ry * 3}px, ${-y * 0.05 + rx * 4}px) scale(1.1)`;
  $("bg2").style.transform = `translate(${-ry * 7}px, ${-y * 0.12 + rx * 8}px)`;
  $("bg2").style.filter = `blur(${z * 5}px)`;
  $("bg3").style.transform = `translate(${-ry * 14}px, ${-y * 0.25 + rx * 14}px) scale(1.15)`;
  $("bg3").style.filter = `blur(${2 + z * 8}px)`;
  $("glare").style.backgroundPosition = "0 0";
  $("glare").style.transform = `translateX(${ry * 14}px)`;
  $("shadow").style.opacity = cl(1 - P(t, 22.2, 23.5));

  // экраны
  const homeOn = t < 3.55, listOn = t >= 3.55 && t < 4.95, chatOn = t >= 4.55;
  show($("home"), homeOn); show($("list"), listOn); show($("chat"), chatOn);
  // переход рабочий стол → Telegram: приложение раскрывается из иконки
  if (t >= 3.3 && t < 3.55) { $("home").style.transform = `scale(${1 + E.io(P(t, 3.3, 3.55)) * 0.15})`; $("home").style.opacity = 1 - P(t, 3.3, 3.55); } else { $("home").style.transform = ""; $("home").style.opacity = 1; }
  if (listOn) { const q = E.out(P(t, 3.55, 3.85)); $("list").style.transform = `scale(${0.82 + 0.18 * q})`; $("list").style.borderRadius = `${(1 - q) * 120}px`; $("list").style.opacity = q; }
  if (chatOn) { const q = E.out(P(t, 4.55, 4.9)); $("chat").style.transform = `translateX(${(1 - q) * 688}px)`; }
  if (t >= 4.55 && t < 4.95) { $("list").style.transform = `translateX(${-E.out(P(t, 4.55, 4.9)) * 220}px)`; $("list").style.filter = `brightness(${1 - 0.25 * P(t, 4.55, 4.9)})`; } else $("list").style.filter = "";
  $("kwrow").style.background = t > 4.18 && t < 4.55 ? "#e3e6ea" : "";

  // сообщения: появление, прокрутка
  let last = null;
  for (const m of MSGS) {
    const el = $(m.id), on = t >= m.t;
    show(el, on);
    if (on) last = m;
  }
  if (last) {
    const q = P(t, last.t, last.t + 0.35);
    $("msgs").style.transform = `translateY(${(1 - E.out(q)) * window.H[last.id]}px)`;
    for (const m of MSGS) {
      if (t < m.t) continue;
      const a = P(t, m.t, m.t + 0.4), el = $(m.id);
      el.style.transform = a < 1 ? `scale(${0.6 + 0.4 * E.back(a)})` : "";
      el.style.opacity = cl(a * 3);
    }
  } else $("msgs").style.transform = "";
  // утренний вопрос: нажатие «8 ч» → сообщение меняется
  const b5 = $("b5");
  if (t >= 13.45) b5.innerHTML = `✅ Сон: 8 ч.\n😴 <b>Отлично выспались, цель 8 ч выполнена!</b>\nХорошего дня!<span class="tm">10:00</span>`;
  else b5.innerHTML = `☀️ Доброе утро! Как вы поспали?<div class="kb">${["5 ч", "6 ч", "7 ч", "8 ч", "9 ч", "10 ч"].map((x) => `<div ${x === "8 ч" ? 'id="k8" style="' + (t > 13.2 ? "background:#3390ec;color:#fff" : "") + '"' : ""}>${x}</div>`).join("")}</div><span class="tm">10:00</span>`;
  if (t >= 13.45 && t < 13.8) b5.style.transform = `scale(${1 + Math.sin(P(t, 13.45, 13.8) * Math.PI) * 0.05})`;
  // отчёт: счётчики
  if (t >= 16.85) {
    const c = E.out(P(t, 17.0, 18.0));
    const r1 = $("r1"), r2 = $("r2"), r3 = $("r3");
    if (r1) { r1.textContent = (c * 7.4).toFixed(1).replace(".", ","); r2.textContent = String(Math.round(c * 8900)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); r3.textContent = Math.round(c * 12); }
  }
  // челлендж: медали падают по местам
  for (let i = 1; i <= 3; i++) {
    const el = $("md" + i);
    if (!el) continue;
    const a = P(t, 20.45 + i * 0.18, 20.8 + i * 0.18);
    el.style.display = "inline-block";
    el.style.transform = `translateY(${(1 - E.el(a)) * -80}px) scale(${0.4 + 0.6 * E.out(a)})`;
    el.style.opacity = cl(a * 4);
  }

  // поле ввода
  const field = $("field"), sb = $("sendb");
  const typing = (T) => t >= T.a && t < T.b + 0.08;
  let txt = "", mode = "idle";
  for (const T of [TYPE1, TYPE2]) if (typing(T)) { txt = T.text.slice(0, Math.round(P(t, T.a, T.b) * T.text.length)); mode = "type"; }
  if (t >= REC.a && t < REC.b) mode = "rec";
  if (mode === "type") { field.className = "field typing"; field.innerHTML = `${txt}<span class="caret" style="opacity:${Math.floor(t * 4) % 2 ? 1 : 0.2}"></span>`; sb.innerHTML = '<div style="width:72px;height:72px;border-radius:50%;background:#3390ec;color:#fff;display:grid;place-items:center;font-size:34px">↑</div>'; }
  else if (mode === "rec") { const secs = Math.floor(P(t, REC.a, REC.b) * 4); field.className = "field"; field.innerHTML = `<span class="rec"><span class="dot" style="opacity:${Math.floor(t * 3) % 2 ? 1 : 0.3}"></span>0:0${secs}  · говорите…</span>`; sb.innerHTML = `<div style="width:${96 + Math.sin(t * 20) * 6}px;height:${96 + Math.sin(t * 20) * 6}px;border-radius:50%;background:#3390ec;color:#fff;display:grid;place-items:center;font-size:40px;margin:-12px">🎤</div>`; }
  else { field.className = "field"; field.textContent = "Сообщение"; sb.innerHTML = "🎤"; }

  // уведомление
  const nIn = E.back(P(t, 14.6, 15.05)), nOut = E.io(P(t, 16.15, 16.5));
  $("notif").style.transform = `translateY(${lerp(-300, 0, nIn) - nOut * 320}px)`;
  $("notif").style.opacity = t > 14.6 && t < 16.5 ? 1 : 0;

  // касания
  const tap = $("tap");
  let tapOn = false;
  for (const T of TAPS) {
    const a = P(t, T.t - 0.12, T.t + 0.28);
    if (a > 0 && a < 1) {
      let tx = T.x, ty = T.y;
      if (T.el) { const r = $(T.el); if (r) { const sr = $("screen").getBoundingClientRect(), er = r.getBoundingClientRect(); const k = $("screen").offsetWidth / sr.width; tx = (er.left + er.width / 2 - sr.left) * k; ty = (er.top + er.height / 2 - sr.top) * k; } }
      tap.style.left = tx + "px"; tap.style.top = ty + "px";
      tap.style.transform = `scale(${0.5 + a * 0.9})`; tap.style.opacity = a < 0.3 ? a / 0.3 : (1 - a) / 0.7;
      tapOn = true;
    }
  }
  if (!tapOn) tap.style.opacity = 0;
  // иконка Telegram нажимается
  const tg = $("tgapp");
  if (tg) tg.style.transform = t > 3.15 && t < 3.4 ? "scale(.88)" : "";

  // карточки итогов: вылетают из телефона на разные глубины
  CARDS.forEach(([, , , cx, cy, cz], i) => {
    const a = E.out(P(t, 17.9 + i * 0.12, 18.7 + i * 0.12)), out = E.io(P(t, 19.7, 20.15));
    const el = $("c" + i);
    el.style.opacity = a > 0 && out < 1 ? cl(a * 2) * (1 - out) : 0;
    el.style.transform = `translate3d(${cx * a}px, ${cy * a}px, ${cz * a + 40}px) rotateY(${(1 - a) * 40 - ry * 0.3}deg) scale(${0.4 + 0.6 * a})`;
  });

  // хук: слова падают с весом, затем втягиваются в экран
  const suck = E.io(P(t, 1.95, 2.55));
  HOOK.forEach((w, i) => {
    const a = P(t, 0.15 + i * 0.32, 0.65 + i * 0.32), el = $("h" + i);
    const drop = (1 - E.el(a)) * -260;
    el.style.opacity = t < 2.55 ? cl(a * 3) * (1 - suck) : 0;
    el.style.transform = `translateY(${drop + suck * (760 - i * 120)}px) scale(${(1 - suck * 0.8) * (i === 3 ? 1 + Math.sin(P(t, 1.5, 1.9) * Math.PI) * 0.08 : 1)}) skewY(${(1 - a) * -6}deg)`;
    el.style.filter = suck > 0 ? `blur(${suck * 10}px)` : "";
  });

  // подписи сцен: слова выезжают по очереди, уходят вверх
  const cap = $("cap");
  const c = CAPS.find((c) => t >= c.a && t < c.b);
  if (c) {
    if (cap.dataset.k !== String(c.a)) { cap.innerHTML = `<div class="pill">${c.words.map((w) => `<span class="cw">${w}</span>`).join("")}</div>`; cap.dataset.k = String(c.a); }
    const pill = cap.firstChild, pa = E.back(P(t, c.a - 0.05, c.a + 0.35)), po = E.io(P(t, c.b - 0.25, c.b));
    pill.style.opacity = cl(pa * 2) * (1 - po);
    pill.style.transform = `scaleX(${0.6 + 0.4 * pa}) scaleY(${0.8 + 0.2 * pa}) translateY(${-po * 40}px)`;
    [...pill.children].forEach((el, i) => {
      const a = E.back(P(t, c.a + i * 0.09, c.a + 0.42 + i * 0.09)), o = E.io(P(t, c.b - 0.3, c.b));
      el.style.opacity = cl(a * 2) * (1 - o);
      el.style.transform = `translateY(${(1 - a) * 70 - o * 60}px) scale(${0.7 + 0.3 * a}) rotate(${(1 - a) * -4}deg)`;
      el.style.filter = a < 0.6 || o > 0.2 ? `blur(${Math.max((0.6 - a) * 10, o * 8)}px)` : "";
    });
  } else { cap.innerHTML = ""; cap.dataset.k = ""; }

  // финал
  const endOn = t >= 22.1;
  $("end").style.display = endOn ? "" : "none";
  if (endOn) {
    "Kwantoww".split("").forEach((ch, i) => {
      const a = E.back(P(t, 22.15 + i * 0.06, 22.65 + i * 0.06)), el = $("L" + i);
      el.style.opacity = cl(a * 2);
      el.style.transform = `translateY(${(1 - a) * 140}px) scale(${0.3 + 0.7 * a}) rotate(${(1 - a) * (i % 2 ? 12 : -12)}deg)`;
    });
    const sa = E.out(P(t, 22.7, 23.2)), ca = E.back(P(t, 22.95, 23.45)), fa = E.out(P(t, 23.2, 23.7));
    $("sub").style.opacity = sa; $("sub").style.transform = `translateY(${(1 - sa) * 40}px)`;
    const pulse = 1 + Math.max(0, Math.sin((t - 23.45) * Math.PI * 2)) * 0.035 * (t > 23.45 ? 1 : 0);
    $("cta").style.opacity = cl(ca * 2); $("cta").style.transform = `scale(${(0.6 + 0.4 * ca) * pulse})`;
    $("free").style.opacity = fa; $("free").style.transform = `translateY(${(1 - fa) * 30}px)`;
  }
  // во время финала телефон уходит вглубь и темнеет
  $("phone").style.filter = t > 22.3 ? `brightness(${1 - P(t, 22.3, 23.2) * 0.55}) blur(${P(t, 22.4, 23.3) * 6}px)` : "";
}

window.__ready = document.fonts.ready.then(() => { build(); renderAt(0); return true; });
window.renderAt = renderAt;
// предпросмотр в браузере: ?play
if (location.search.includes("play")) window.__ready.then(() => { const s = performance.now(); const loop = () => { renderAt(((performance.now() - s) / 1000) % 25); requestAnimationFrame(loop); }; loop(); });
</script>
