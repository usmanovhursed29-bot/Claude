name = "dating-bot"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
keep_vars = true

# ADMIN_ID и CHAT_LINK задаются в панели Cloudflare (Settings → Variables and Secrets).
# keep_vars = true — деплой их не затирает.

[[d1_databases]]
binding = "DB"
database_name = "dating-bot-db"
database_id = "46626d9c-9949-4183-a41e-51330cec9811"

# BOT_TOKEN и WEBHOOK_SECRET — секреты, задаются в панели Cloudflare, не здесь!
