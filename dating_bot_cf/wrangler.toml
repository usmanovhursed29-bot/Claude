name = "dating-bot"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
keep_vars = true

[vars]
# Твой Telegram ID (из @userinfobot) — сюда приходят жалобы
ADMIN_ID = ""
# Ссылка-приглашение в общий чат (оставь пустым, если чата нет)
CHAT_LINK = ""

[[d1_databases]]
binding = "DB"
database_name = "dating-bot-db"
database_id = "46626d9c-9949-4183-a41e-51330cec9811"

# BOT_TOKEN и WEBHOOK_SECRET — секреты, задаются в панели Cloudflare, не здесь!
