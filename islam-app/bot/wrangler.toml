name = "islam-app-bot"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "islam-app"
database_id = "TODO-после-создания-базы"

[[r2_buckets]]
binding = "BACKUP"
bucket_name = "islam-app-backup"

# Резервная копия раз в сутки, 03:17 UTC
[triggers]
crons = ["17 3 * * *"]

# Секреты: wrangler secret put BOT_TOKEN / WEBHOOK_SECRET / ADMIN_CHAT_IDS
