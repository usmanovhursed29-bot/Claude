<title>Намаз и кибла</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Макет: приложение в один экран, сверху карточка следующего намаза, снизу вкладки как в мобильных приложениях. */
:root {
  --bg: #f4f6f3; --card: #ffffff; --fg: #15231d; --muted: #66756e; --line: #e2e8e4;
  --accent: #0e7a55; --accent-ink: #ffffff; --accent-soft: #e2f3ec; --gold: #c99a2e; --hero1: #0e7a55; --hero2: #0b5e44;
  --body: "Inter", "Segoe UI", system-ui, sans-serif; --arabic: "Amiri", "Noto Naskh Arabic", serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1512; --card: #16211c; --fg: #e6efe9; --muted: #8fa39a; --line: #24332c;
  --accent: #3fbf8f; --accent-ink: #06140f; --accent-soft: #173229; --gold: #e2b955; --hero1: #145c44; --hero2: #0d3f2f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1512; --card: #16211c; --fg: #e6efe9; --muted: #8fa39a; --line: #24332c;
  --accent: #3fbf8f; --accent-ink: #06140f; --accent-soft: #173229; --gold: #e2b955; --hero1: #145c44; --hero2: #0d3f2f; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--body); -webkit-tap-highlight-color: transparent; }
.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: grid; grid-template-rows: 1fr auto; }
main { padding-left: var(--gl); padding-right: var(--gr); padding-block: 16px 24px; display: grid; gap: 14px; align-content: start; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.muted { color: var(--muted); }
h2 { margin: 0; font-size: 18px; font-weight: 700; }

.hero { color: #fff; border-radius: 24px; padding: 20px; background: linear-gradient(150deg, var(--hero1), var(--hero2)); display: grid; gap: 4px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 18px solid rgba(255,255,255,.07); }
.hero .place { font-size: 13px; opacity: .85; display: flex; gap: 6px; align-items: center; }
.hero .label { font-size: 14px; opacity: .85; margin-top: 8px; }
.hero .name { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
.hero .count { font-size: 15px; font-variant-numeric: tabular-nums; }
.hero .count b { font-size: 22px; color: #ffe7a8; }

.list { display: grid; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
.row.next { color: var(--accent); }
.row.next span:first-child::before { content: "● "; }
.row.passed { color: var(--muted); }
.row.sun { color: var(--muted); font-size: 15px; }

.locate { display: grid; gap: 10px; justify-items: start; }
.locate select, .set select[data-city] { margin-top: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.wide { width: 100%; }

.compass { display: grid; justify-items: center; gap: 12px; text-align: center; }
.dial { position: relative; width: min(280px, 78vw); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--card); border: 1px solid var(--line); box-shadow: inset 0 0 0 10px var(--accent-soft); }
.rose { position: absolute; inset: 0; transition: transform .25s ease-out; }
.rose span { position: absolute; left: 50%; top: 50%; font-weight: 700; font-size: 14px; color: var(--muted); }
.rose .n { color: #d84a3a; }
.kaaba { position: absolute; left: 50%; top: 50%; width: 4px; height: 44%; margin-left: -2px; transform-origin: 50% 100%; translate: 0 -100%; }
.kaaba i { position: absolute; left: 50%; top: -8px; translate: -50% 0; width: 34px; height: 34px; border-radius: 8px; background: #1b1b1b; border-top: 6px solid var(--gold); display: block; }
.kaaba::before { content: ""; position: absolute; inset: 26px 0 0; background: linear-gradient(var(--gold), transparent); border-radius: 2px; }
.hub { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; translate: -50% -50%; border-radius: 50%; background: var(--accent); }
.deg { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.aligned { color: var(--accent); font-weight: 600; }

.zikr { display: grid; gap: 14px; justify-items: center; text-align: center; }
.chips { display: flex; gap: 8px; overflow-x: auto; width: 100%; padding-bottom: 4px; scrollbar-width: none; }
.chip { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ar { font-family: var(--arabic); font-size: 30px; line-height: 1.6; direction: rtl; }
.tap { position: relative; width: min(230px, 64vw); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); user-select: none; touch-action: manipulation; transition: transform .08s; }
.tap:active { transform: scale(.97); }
.tap svg { position: absolute; inset: 0; width: 100%; height: 100%; rotate: -90deg; }
.tap circle { fill: none; stroke-width: 10; }
.tap .track { stroke: var(--accent-soft); }
.tap .prog { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .2s; }
.tap b { font-size: 48px; font-variant-numeric: tabular-nums; }
.tap small { display: block; color: var(--muted); font-size: 14px; }
.zrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.set { display: grid; gap: 8px; }
.set label { font-size: 14px; color: var(--muted); font-weight: 500; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--accent-soft); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { padding: 9px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px; width: 100%; }

nav.tabs { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--card); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs button { display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 12px; font-weight: 500; color: var(--muted); border-radius: 12px; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
.view { display: grid; gap: 14px; animation: in .25s ease both; }
@keyframes in { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/adhan@4.4.6/lib/bundles/adhan.umd.min.js"></script>

  var KEYS = ["fajr", "sunrise", "dhuhr", "asr", "maghrib", "isha"];
  // Города для ручного выбора, если человек не дал доступ к GPS: [ru, en, широта, долгота, часовой пояс]

    ["Торонто", "Toronto", 43.6532, -79.3832, "America/Toronto"], ["Сеул", "Seoul", 37.5665, 126.978, "Asia/Seoul"]
  ];
  function cityName(c) { return S.lang === "ru" ? c[0] : c[1]; }
  var DEMO = { lat: 38.5598, lon: 68.787, tz: "Asia/Dushanbe", demo: true };
  var defLang = ((TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.language_code) || navigator.language || "ru").indexOf("ru") === 0 ? "ru" : "en";
  var S = { tab: "prayer", lang: store.get("lang", defLang), method: store.get("method", "MuslimWorldLeague"), madhab: store.get("madhab", "Hanafi"),
    loc: store.get("loc", null), denied: false, heading: null, zikr: store.get("zikr", "subhan"), counts: store.get("counts", {}) };
  var L = function () { return I[S.lang] || I.ru; };
  var main = document.getElementById("main"), tabs = document.getElementById("tabs");
  var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  var timer = null;

  function track(type) {

      (h == null ? '<button class="btn soft" data-act="compass">🧭 ' + L().startCompass + "</button>" : "") + '<p class="muted">📍 ' + placeLine() + "</p></section>";
  }

  function onHeading(deg) { S.heading = (deg + 360) % 360; if (S.tab === "qibla") { var r = main.querySelector(".rose"); if (r) r.style.transform = "rotate(" + -S.heading + "deg)"; } }
  function startCompass() {
    if (TG && TG.DeviceOrientation) {
      TG.DeviceOrientation.start({ need_absolute: true, refresh_rate: 100 });
      TG.onEvent("deviceOrientationChanged", function () { var a = TG.DeviceOrientation.alpha; if (a != null) { var first = S.heading == null; onHeading(360 - a * 180 / Math.PI); if (first) render(); } });
      return;
    }
    var attach = function () {
      var handler = function (e) { var hd = e.webkitCompassHeading != null ? e.webkitCompassHeading : (e.absolute || e.type === "deviceorientationabsolute") && e.alpha != null ? 360 - e.alpha : null; if (hd != null) { var first = S.heading == null; onHeading(hd); if (first) render(); } };
      window.addEventListener("deviceorientationabsolute", handler);
      window.addEventListener("deviceorientation", handler);
    };
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") DeviceOrientationEvent.requestPermission().then(function (r) { if (r === "granted") attach(); }).catch(function () {});
    else attach();
  }

  function zikrView() {
    var z = L().zikrs.find(function (x) { return x[0] === S.zikr; }) || L().zikrs[0];
    var c = S.counts[z[0]] || { s: 0, t: 0 }, goal = z[4], frac = Math.min(1, c.s / goal), R = 104, C = 2 * Math.PI * R;
    var chips = L().zikrs.map(function (x) { return '<button class="chip" data-zikr="' + x[0] + '" aria-pressed="' + (x[0] === z[0]) + '">' + x[2] + "</button>"; }).join("");
    return '<div class="chips">' + chips + '</div><section class="card zikr"><div class="ar">' + z[1] + '</div><div><b>' + z[2] + '</b><div class="muted">' + z[3] + "</div></div>" +
      '<button class="tap" data-act="count" aria-label="+1"><svg viewBox="0 0 240 240"><circle class="track" cx="120" cy="120" r="' + R + '"/><circle class="prog" cx="120" cy="120" r="' + R + '" stroke-dasharray="' + C + '" stroke-dashoffset="' + C * (1 - frac) + '"/></svg><div><b>' + c.s +
      "</b><small>" + L().goal + ": " + goal + "</small></div></button>" + '<p class="muted">' + (c.s >= goal ? "✅ " + L().done : L().total + ": " + c.t) + '</p><div class="zrow"><button class="btn soft" data-act="zreset">↺ ' + L().reset + "</button></div></section>";
  }

  function settingsView() {
    var seg = function (key, opts) { return '<div class="seg">' + opts.map(function (o) { return '<button data-set="' + key + '" data-val="' + o[0] + '" aria-pressed="' + (S[key] === o[0]) + '">' + o[1] + "</button>"; }).join("") + "</div>"; };
    var methods = Object.keys(L().methods).map(function (k) { return '<option value="' + k + '"' + (S.method === k ? " selected" : "") + ">" + L().methods[k] + "</option>"; }).join("");
    return '<section class="card set"><label>' + L().lang + "</label>" + seg("lang", [["ru", "Русский"], ["en", "English"]]) + "</section>" +
      '<section class="card set"><label for="method">' + L().method + '</label><select id="method">' + methods + '</select><label>' + L().asr + "</label>" + seg("madhab", [["Hanafi", L().hanafi], ["Shafi", L().shafi]]) +
      '<p class="muted">' + L().hint + "</p></section>" +
      '<section class="card set"><p class="muted">📍 ' + placeLine() + "<br>" + L().tz + ": " + zone() + '</p><button class="btn wide" data-act="locate">📍 ' + L().relocate + "</button>" + citySelect("city2") + "</section>";
  }

  var ICONS = {
    prayer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V11a8 8 0 0 1 16 0v10"/><path d="M12 3v0M9 21v-5a3 3 0 0 1 6 0v5M2 21h20"/></svg>',
    qibla: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>',
    zikr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><circle cx="6" cy="9" r="2"/><circle cx="18" cy="9" r="2"/><circle cx="8" cy="16" r="2"/><circle cx="16" cy="16" r="2"/><path d="M12 18v4"/></svg>',
    settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
  };
  var TABS = ["prayer", "qibla", "zikr", "settings"];

  function render() {
    document.documentElement.lang = S.lang;
    tabs.innerHTML = TABS.map(function (k, i) { return '<button data-tab="' + k + '"' + (S.tab === k ? ' aria-current="page"' : "") + ">" + ICONS[k] + "<span>" + L().tabs[i] + "</span></button>"; }).join("");
    var v = S.tab === "qibla" ? qiblaView() : S.tab === "zikr" ? zikrView() : S.tab === "settings" ? settingsView() : prayerView();
    main.innerHTML = '<div class="view">' + v + "</div>";
    [].forEach.call(main.querySelectorAll("select[data-city]"), function (el) {
      el.onchange = function () {
        if (el.value === "") return;
        var c = CITIES[+el.value];
        S.loc = { lat: c[2], lon: c[3], tz: c[4], city: +el.value }; S.denied = false; store.set("loc", S.loc); track("app_city"); render();
      };
    });
    var sel = document.getElementById("method");
    if (sel) sel.onchange = function () { S.method = sel.value; store.set("method", S.method); track("app_settings"); };
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.tab) { S.tab = b.dataset.tab; track("app_" + S.tab); render(); window.scrollTo(0, 0); return; }
    if (b.dataset.zikr) { S.zikr = b.dataset.zikr; store.set("zikr", S.zikr); render(); return; }
    if (b.dataset.set) { S[b.dataset.set] = b.dataset.val; store.set(b.dataset.set, b.dataset.val); track("app_settings"); render(); return; }
    var act = b.dataset.act;
    if (act === "locate") locate();
    if (act === "compass") startCompass();
    if (act === "count" || act === "zreset") {
      var z = L().zikrs.find(function (x) { return x[0] === S.zikr; }), c = S.counts[S.zikr] || { s: 0, t: 0 };
      if (act === "count") { c.s++; c.t++; haptic(c.s === z[4] ? "done" : "tap"); if (c.s === z[4]) track("app_zikr_goal"); } else c.s = 0;
      S.counts[S.zikr] = c; store.set("counts", S.counts); render();
    }
  });

  if (TG) { TG.ready(); TG.expand(); track("app_open"); }
  render();
  if (!S.loc) locate();
  timer = setInterval(function () { if (S.tab === "prayer") render(); }, 30000);
})();
</script>
